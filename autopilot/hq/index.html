  box-shadow:0 -4px 0 0 var(--ink0),0 4px 0 0 var(--ink0),-4px 0 0 0 var(--ink0),4px 0 0 0 var(--ink0),inset 0 0 0 3px var(--win),inset 0 0 0 5px var(--frame2);
  filter:drop-shadow(4px 4px 0 var(--drop))}
/* header */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.hello h1{margin:0;font:400 26px/1.15 var(--caps);letter-spacing:.02em;text-transform:uppercase}
.hello .sub{margin-top:8px;font-size:15px;color:var(--ink-2)}
.hello .when{font:12px var(--caps);color:var(--ink-3);text-align:right;white-space:nowrap;text-transform:uppercase}
/* broken banner */
.alarm{display:flex;gap:10px;align-items:flex-start;--win:#ffe1dc;color:#3a1015;padding:12px 14px;margin:4px 4px 18px;font-size:14px}
.alarm b{color:#3a1015;font-family:var(--caps);font-weight:400;text-transform:uppercase}.alarm a{color:#3a1015!important}
.pace{display:flex;gap:10px;align-items:flex-start;--win:#fff3cf;color:#3d2c00;padding:10px 14px;margin:4px 4px 18px;font-size:14px}.pace .dim{color:#5c4a14}.pace b{font-family:var(--caps);font-weight:400;font-size:12px;text-transform:uppercase}.pz-i{flex:none;width:18px;height:18px;display:grid;place-items:center;background:#f0b828;color:#1d2129;font:400 12px var(--caps);margin-top:1px}
.alarm .dot{width:12px;height:12px;background:#e02f3c;margin-top:4px;flex:none;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* NOW = RPG dialog box with a speaker nameplate and a blinking ▼ */
.now{position:relative;padding:26px 18px 22px;margin:18px 4px 18px;--plate:var(--pl-sun);animation:popin .35s steps(4) both}
.now.decide{--plate:var(--pl-dec)}.now.meet{--plate:var(--pl-meet)}.now.eve{--plate:var(--pl-eve)}.now.zero{--plate:var(--pl-zero)}.now.week{--plate:var(--pl-week)}
.now>.k:first-of-type{position:absolute;left:14px;top:-14px;background:var(--plate);color:#1d2129;font:400 11px/1 var(--caps);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px 6px;
  box-shadow:0 -3px 0 0 #1d2129,0 3px 0 0 #1d2129,-3px 0 0 0 #1d2129,3px 0 0 0 #1d2129;max-width:calc(100% - 110px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .k{font:400 11px var(--caps);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.now::after{content:"";position:absolute;right:16px;bottom:12px;width:12px;height:8px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%);animation:nudge 1s steps(2) infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.now h2{margin:4px 0 6px;font:500 22px/1.3 var(--px);padding-right:70px;min-height:1.3em}
.now p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.now .big{font:400 40px/1 var(--caps)}
.now .row2{display:flex;gap:0;flex-wrap:wrap;margin-top:14px;border-top:2px dashed var(--frame2);padding-top:10px}
.now .row2>div{min-width:96px;padding:0 14px 0 0;margin-right:14px;border-right:2px dashed var(--frame2)}.now .row2>div:last-child{border-right:0}
.now .row2 .n{font:400 22px/1.2 var(--caps)}.now .row2 .l{font-size:12.5px;color:var(--ink-3)}
.now ul{margin:10px 0 0;padding-left:0;list-style:none}.now li{margin:5px 0;padding-left:16px;position:relative}
.now li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;background:var(--ink-2)}
.now .cta{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font:400 12px var(--caps);text-transform:uppercase;color:var(--ink);text-decoration:none;padding:12px 14px 12px 26px;min-height:44px;position:relative;background:var(--win2)}
.now .cta::before,.ans button::before,.ans a.open::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:12px;margin-top:-6px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%);opacity:0}
.now .cta::before{opacity:1;animation:blink 1s steps(1) infinite}
.doodle{position:absolute;right:14px;top:14px;width:52px;height:52px;pointer-events:none;image-rendering:pixelated;animation:hop 1.6s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-3px)}}
/* chips = one status window, three columns */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:4px 4px 22px;padding:6px 4px}
.chip{background:none;border:0;text-decoration:none;color:var(--ink);border-left:2px dashed var(--frame2);padding:8px 10px;min-width:0;text-align:left;cursor:pointer;min-height:64px}
.chip:first-child{border-left:0}
.chip:hover,.chip:focus-visible{background:var(--win2);outline:none}
.chip .v{font:400 19px/1.2 var(--caps);white-space:nowrap}.chip .l{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.25}
.chip.good .v{color:var(--good)}.chip.warn .v{color:var(--warn)}.chip.bad .v{color:var(--bad)}
/* section titles look like menu headers */
h3.sec{display:flex;align-items:baseline;gap:8px;margin:26px 4px 12px;font:400 13px var(--caps);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
h3.sec::before{content:"";width:8px;height:8px;background:var(--ink);flex:none;align-self:center}
h3.sec .c{font:13px var(--px);letter-spacing:0;color:var(--ink-3);text-transform:none}
/* needs = one quest log window, rows inside */
.q{display:block;padding:6px 0}
.need{position:relative;padding:14px 16px 12px 30px;border-top:2px dashed var(--frame2);transition:opacity .3s steps(3),max-height .4s steps(4);max-height:900px;overflow:hidden}
.need:first-child{border-top:0}
.need::before{content:"";position:absolute;left:12px;top:20px;width:8px;height:8px;background:var(--frame2)}
.need.hot::before{background:var(--hp-y);box-shadow:0 0 0 2px var(--ink0)}.need.over::before{background:var(--hp-r);box-shadow:0 0 0 2px var(--ink0);animation:blink 1s steps(1) infinite}
.need .t{font:500 17px/1.3 var(--px)}
.need .m{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font:400 11px var(--caps);text-transform:uppercase;color:var(--ink-3)}
.need .m .due{color:var(--ink)}.need.hot .due{color:var(--warn)}.need.over .due{color:var(--bad)}
.need .d{margin-top:8px;font:13.5px/1.5 var(--mono);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.need .d.open{-webkit-line-clamp:unset;display:block}
.need .more{background:none;border:0;padding:4px 0;color:var(--acc2);font:400 11px var(--caps);text-transform:uppercase;cursor:pointer;min-height:32px}
/* answers = a small battle-style choice menu */
.ans{display:inline-flex;flex-wrap:wrap;gap:0 4px;margin:12px 4px 4px;padding:4px 6px}
.ans button,.ans a.open{position:relative;background:none;border:0;padding:10px 14px 10px 24px;min-height:44px;cursor:pointer;font:500 15.5px var(--px);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.ans button:hover,.ans button:focus-visible,.ans a.open:hover,.ans a.open:focus-visible{background:var(--sel);color:#1d2129;outline:none}
.ans button:hover::before,.ans button:focus-visible::before,.ans a.open:hover::before,.ans button.rec::before{opacity:1}
.ans button:hover::before,.ans button:focus-visible::before,.ans a.open:hover::before{background:#1d2129}
.ans button.rec{font-weight:600}
.ans button:disabled{opacity:.6}
.wiggle{animation:zap .36s steps(6)}
@keyframes zap{0%,100%{transform:none}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}
.need.done{opacity:0;max-height:0;padding-top:0;padding-bottom:0;border-width:0}
.checkpop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;z-index:50;
  width:96px;height:96px;background:var(--hp-g);display:grid;place-items:center;
  box-shadow:0 -5px 0 0 #1d2129,0 5px 0 0 #1d2129,-5px 0 0 0 #1d2129,5px 0 0 0 #1d2129,inset 0 0 0 4px #8fe39b;transition:transform .2s steps(3),opacity .15s steps(2)}
.checkpop.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.checkpop svg{width:52px;height:52px}.checkpop path{stroke:#1d2129;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:60;stroke-dashoffset:60}.checkpop.on path{transition:stroke-dashoffset .3s .05s steps(5);stroke-dashoffset:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:40%;left:50%;width:8px;height:8px;animation:conf 1.2s steps(12) forwards}
@keyframes conf{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
.zeroq{text-align:center;padding:22px 16px;color:var(--ink-2)}
.zeroq .e{font-size:30px;display:inline-block;animation:hop 1.2s steps(2) infinite}.zeroq b{display:block;color:var(--good);font:400 16px var(--caps);text-transform:uppercase;margin:8px 0 4px}
.later{margin:14px 0 0}.later summary{cursor:pointer;color:var(--ink-2);font:400 12px var(--caps);text-transform:uppercase;min-height:44px;display:flex;align-items:center;padding-left:4px}
.later ul{list-style:none;margin:6px 4px 4px;padding:4px 14px}.later li{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-top:2px dashed var(--frame2);font-size:14px}.later li:first-child{border-top:0}
.later li span:last-child{color:var(--ink-3);white-space:nowrap;font:11px var(--caps);text-transform:uppercase}
/* goals = one stats screen */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:6px 4px}
.goal{padding:14px 14px;min-width:0;border-top:2px dashed var(--frame2)}
.goal:nth-child(1){border-top:0}.goal:not(.wide)+.goal:not(.wide){border-left:2px dashed var(--frame2)}
.goal.wide{grid-column:1/-1}
.goal .gk{font:400 11px var(--caps);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.goal .gv{font:400 26px/1.2 var(--caps);margin-top:6px}.goal .gv small{font:13px var(--px);color:var(--ink-2)}
.goal .gs{font-size:13px;color:var(--ink-2);margin-top:6px}
/* HP-style bars: chunky, segmented */
.bar,.hp{height:14px;background:var(--track);overflow:hidden;margin-top:10px;position:relative;
  box-shadow:0 -2px 0 0 var(--ink0),0 2px 0 0 var(--ink0),-2px 0 0 0 var(--ink0),2px 0 0 0 var(--ink0);margin-left:2px;margin-right:2px}
.bar i,.hp i{display:block;height:100%;background:var(--acc);position:relative}
.bar i::after,.hp i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.28) 10px 12px),linear-gradient(rgba(255,255,255,.35) 0 3px,transparent 3px)}
.bar s{position:absolute;top:0;bottom:0;width:2px;background:var(--ink0)}
.hp{height:12px;margin-top:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:54px;margin-top:12px}
.days span{display:flex;flex-direction:column;justify-content:flex-end;height:100%;font:10px var(--caps);color:var(--ink-3);text-align:center;gap:4px}
.days i{display:block;min-height:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.funnel{display:flex;gap:0;margin-top:12px}
.funnel div{flex:1;padding:6px 4px;text-align:center;min-width:0;border-left:2px dashed var(--frame2)}.funnel div:first-child{border-left:0}
.funnel b{display:block;font:400 20px/1.2 var(--caps)}.funnel span{font-size:11.5px;color:var(--ink-2)}
/* footer */
.fleet{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 4px 4px;padding:14px 16px 14px 30px;color:var(--ink);text-decoration:none;min-height:56px;position:relative;font:400 13px var(--caps);text-transform:uppercase}
.fleet::before{content:"";position:absolute;left:12px;top:50%;width:8px;height:12px;margin-top:-6px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%);animation:blink 1s steps(1) infinite}
.fleet:hover{background:var(--win2)}
.fleet .s{font:13px var(--px);color:var(--ink-2);text-transform:none;margin-top:2px}
.foot{margin-top:20px;text-align:center;font:11px var(--caps);text-transform:uppercase;color:var(--ink-3)}
.foot a{color:var(--acc2)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe));transform:translateX(-50%) translateY(20px);opacity:0;color:var(--ink);padding:12px 18px;font:15px var(--px);transition:.2s steps(3);z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.err{padding:40px 16px;text-align:center;color:var(--ink-2)}
/* nav + layout */
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tabs{display:inline-flex;padding:4px;gap:0}
.tabs a{position:relative;color:var(--ink-2);padding:8px 12px 8px 22px;font:400 12px var(--caps);text-transform:uppercase;min-height:36px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.tabs a.on{color:var(--ink)}
.tabs a.on::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:10px;margin-top:-5px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%)}
.pip{display:inline-block;width:8px;height:8px;background:var(--ink-3)}.pip.bad{background:var(--hp-r)}.pip.good{background:var(--hp-g)}.pip.acc{background:var(--hp-b)}
.cols{display:block}.col{min-width:0}
.keys{display:none;margin-left:auto;font:10px var(--caps);letter-spacing:.02em;color:var(--ink-3)}
.need.sel{background:var(--win2)}.need.sel::before{background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%);width:8px;height:12px;top:18px;box-shadow:none}
.now.sel{outline:3px dashed var(--acc);outline-offset:8px}
.card{padding:14px 16px}
.bar.thin{height:10px;margin-top:8px}
@keyframes popin{0%{opacity:0;transform:scaleY(.2)}50%{opacity:1;transform:scaleY(.6)}100%{opacity:1;transform:none}}
/* day plan */
.plan{display:block;padding:4px 0}.pday{padding:12px 16px;border-top:2px dashed var(--frame2)}.pday:first-child{border-top:0}
.ph{display:flex;gap:8px;align-items:baseline;font-size:14px}.ph b{font:400 12px var(--caps);text-transform:uppercase}
.tl{list-style:none;margin:8px 0 0;padding:0}.tl li{display:flex;gap:10px;padding:6px 0;font-size:14.5px}
.tl li span:first-child{color:var(--acc2);min-width:118px;white-space:nowrap;font:13px var(--caps)}.tl li.k-focus span:first-child{color:var(--good)}.tl li.k-class span:first-child{color:var(--warn)}
/* fleet = the party screen */
.allgo{display:flex;gap:10px;align-items:center;--win:#dff6e3;color:#173d22;padding:12px 16px;margin:4px 4px 18px;font:400 13px var(--caps);text-transform:uppercase}
.agents{display:block;padding:4px 0}
.ag{display:flex;gap:14px;padding:12px 16px;border-top:2px dashed var(--frame2);align-items:flex-start}
.ag:first-child{border-top:0}
.ag.st-stalled{background:color-mix(in srgb,var(--hp-r) 14%,var(--win))}
.av{position:relative;flex:none;width:48px;height:56px}
.av svg{width:48px;height:56px;display:block;image-rendering:pixelated;shape-rendering:crispEdges}
.ag.st-working .av svg{animation:hop 1.2s steps(2) infinite}
.ag.st-stalled .av svg{animation:zap .6s steps(4) infinite}
.av .z{position:absolute;right:-8px;top:-4px;font:400 11px var(--caps);color:var(--ink-3);animation:hop 2s steps(2) infinite}
.ab{min-width:0;flex:1}.an{font:400 14px var(--caps);text-transform:uppercase;display:flex;flex-wrap:wrap;align-items:center;gap:6px}.an a{color:var(--ink);text-decoration:none}
.ad{font-size:14px;color:var(--ink-2);margin:4px 0 2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font:400 10px/1 var(--caps);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px 3px;background:var(--win2);color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--frame2)}
.st.good{background:#d4f5da;color:#14532a;box-shadow:inset 0 0 0 2px #38b048}.st.bad{color:#fff;background:#c42a33;box-shadow:none;animation:blink 1s steps(1) infinite}.st.acc{background:#d9e6ff;color:#1c3f8f;box-shadow:inset 0 0 0 2px #4a7cf0}
.ug{margin-top:6px;font-size:13px}.bar.empty{background:repeating-linear-gradient(90deg,var(--track) 0 10px,transparent 10px 12px)}.ug .wk{font:400 10px var(--caps);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:6px 0 -4px 2px}.ul{margin-top:6px}.ul b{font:400 13px var(--caps)}
.brow{display:flex;justify-content:space-between;font-size:14.5px;margin-top:12px}.brow .mono{font:400 13px var(--caps)}.brow.pz{opacity:.55}
.ship{margin:2px 0 6px;padding-left:0;list-style:none}.ship li{padding:7px 0;font-size:14px;border-top:2px dashed var(--frame2);overflow-wrap:anywhere}.ship li:first-child{border-top:0}
.det{margin-top:18px}.det summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;font:400 12px var(--caps);text-transform:uppercase}
.pt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 10px}.pt th,.pt td{text-align:left;padding:5px 4px;border-top:2px dashed var(--frame2)}.pt th{color:var(--ink-3);font:400 10px var(--caps);text-transform:uppercase}
@media (max-width:430px){.hello h1{font-size:22px}.chip .v{font-size:17px}.goal .gv{font-size:22px}.funnel b{font-size:17px}.funnel span{font-size:10.5px}.now h2{font-size:20px}}
@media (min-width:1000px){
  .wrap{max-width:1240px;padding:28px 32px 40px}
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;align-items:start}
  .col.side h3.sec:first-child{margin-top:0}.side #goals{margin-top:0}
  .keys{display:inline}
  .hello h1{font-size:32px}
  .now h2{font-size:26px}
  .doodle{width:64px;height:64px}
}

.krs{list-style:none;margin:8px 0 0;padding:0}.krs li{padding:10px 0;border-top:2px dashed var(--frame2)}.krs li:first-child{border-top:0;padding-top:4px}.krs .kt{font-size:15px}.krs .kv{margin-top:4px;font-size:13px}.krs .kv b{font:400 16px var(--caps)}.krs .kv small{font:12px var(--px);color:var(--ink-2)}.krs .kn{font-size:12.5px;margin-top:4px}
.ur{padding:6px 8px}.urow{display:grid;grid-template-columns:26px 78px minmax(0,1fr) 72px;gap:10px;align-items:center;padding:7px 8px;color:var(--ink);text-decoration:none;border-top:2px dashed var(--frame2)}
.urow:first-child{border-top:0}.urow:hover,.urow:focus-visible{background:var(--win2);outline:none}
.urow.behind{background:#fff3cf}.urow.behind:hover{background:#ffeab0}
.uav{width:26px;height:26px;position:relative}.uav svg{width:26px;height:26px;display:block;image-rendering:pixelated}.uav .z{display:none}
.un{font:400 11px var(--caps);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .bar{margin-top:0}.bar.nl{background:repeating-linear-gradient(90deg,var(--track) 0 4px,transparent 4px 8px);opacity:.6}
.uv{font:400 11px var(--caps);text-transform:uppercase;text-align:right;white-space:nowrap}
.pjs{list-style:none;margin:0;padding:0}.pj{padding:10px 0;border-top:2px dashed var(--frame2)}.pj:first-child{border-top:0;padding-top:2px}
.pj-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}.pj-n{font:400 13px var(--caps);text-transform:uppercase}.pj-n a{color:var(--ink);text-decoration:none}.pj-n a:hover{text-decoration:underline}
.st.warn{background:#fff3cf;color:#6b4a00;box-shadow:inset 0 0 0 2px #f0b828}
.pj-a{font-size:12.5px;flex-basis:100%}.pj-s{font-size:13.5px;margin-top:4px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pjs+.later,.card .later{margin-top:6px}.card .later ul{box-shadow:none;margin:0;padding:0 2px;background:none}
/* overworld strip */
.ow{position:relative;margin:12px 2px 4px;padding-top:10px}
.ow-row{display:grid;grid-template-columns:repeat(16,1fr);box-shadow:0 0 0 2px var(--ink0)}
.ow-t svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.ow-hero{position:absolute;top:-6px;width:16px;margin-left:-8px;animation:hop 1s steps(2) infinite;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
.ow-hero svg{display:block;width:16px;height:20px}
.ow-ax{display:flex;justify-content:space-between;font:9px var(--caps);color:var(--ink-3);margin-top:4px;text-transform:uppercase}
/* level-up */
.lvl{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:4px}
.lvl-star{width:48px;height:48px;animation:hop 1s steps(2) infinite}
.lvl-t{font:400 15px var(--caps);text-transform:uppercase;color:#1d2129;background:var(--hp-y);padding:5px 10px 4px;box-shadow:0 -3px 0 0 #1d2129,0 3px 0 0 #1d2129,-3px 0 0 0 #1d2129,3px 0 0 0 #1d2129;animation:lvlpop .5s steps(4) both}
.lvl-lv{font:400 11px var(--caps);text-transform:uppercase;color:var(--good)}
@keyframes lvlpop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:none}}
.lvl .sp{position:absolute;width:6px;height:6px;background:var(--hp-y);box-shadow:0 0 0 2px var(--ink0);animation:spark 1.2s steps(3) infinite}
.lvl .s1{left:-18px;top:6px}.lvl .s2{right:-16px;top:18px;animation-delay:.4s}.lvl .s3{left:-6px;top:40px;animation-delay:.8s}
@keyframes spark{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<main class="wrap" id="app"><p class="err">Loading…</p></main>
<div class="checkpop" id="pop" aria-hidden="true"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-18" fill="none" stroke="#06261a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* HQ v2: one "Now" card chosen by time and context, one Needs queue, goal visuals; #fleet is the v2 Fleet view.
   Data: /api/data (deployed) or data.json (static). Answers: /api/answer, else a prefilled GitHub issue. No names in source. */
const PT={timeZone:"America/Los_Angeles"};
const Q=new URLSearchParams(location.search);
const NOW=()=>{const a=Q.get("at"); const t=a?new Date(a):null; return t&&!isNaN(t)?t:new Date()}; // ?at=2026-11-25T08:00-08:00 simulates a time
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>typeof v==="number"&&isFinite(v)?v:null;
const isDate=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v)&&!isNaN(new Date(v));
const asDay=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)?v+"T12:00:00-08:00":v;
const ptDay=t=>new Date(t).toLocaleDateString("en-CA",PT);
const ptHour=t=>+new Date(t).toLocaleString("en-US",{...PT,hour:"numeric",hour12:false})%24;
const ptDow=t=>new Date(t).toLocaleDateString("en-US",{...PT,weekday:"short"});
const tm=t=>new Date(t).toLocaleTimeString("en-US",{...PT,hour:"numeric",minute:"2-digit"});
const dayLbl=t=>new Date(t).toLocaleDateString("en-US",{...PT,weekday:"short",month:"short",day:"numeric"});
const minsUntil=t=>Math.round((new Date(t)-NOW())/6e4);
const OPS=/^https:\/\/github\.com\/zuzivian\/ops-bus\/(?:blob|tree)\/main\/([^?#]*)(#.*)?$/;
const link=u=>{u=String(u||""); const m=u.match(OPS); if(m){let p=m[1];try{p=decodeURIComponent(p)}catch(_){} return "/api/file?path="+encodeURIComponent(p.replace(/\/+$/,""))+(m[2]||"")} return /^https:\/\//.test(u)?u:""};
const ISSUE_NEW="https://github.com/zuzivian/ops-bus/issues/new";
let D=null, ONE=null, SRC=null;

/* ---------- data ---------- */
const getJSON=u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok||!/json/i.test(r.headers.get("content-type")||""))throw new Error(u);return r.json()});
const fetchData=()=>SRC?getJSON(SRC):getJSON("/api/data").then(d=>(SRC="/api/data",d),()=>getJSON("data.json").then(d=>(SRC="data.json",d)));
const live=x=>{const s=String(x&&x.disposition&&x.disposition.status||"").trim().toLowerCase();return !s||s==="proposed"};
const verifying=n=>/^(verifying|waiting|done_pending)$/i.test(String(n.state||n.status||""))||/\b(fleet ops|supervisor) is verifying\b|reported this done/i.test(String(n.detail||""));
function queue(d){ // needs + Nat's live actions, one list, soonest first
  const acts=(d.nat_actions||[]).filter(x=>x&&x.title&&live(x)), gone=new Set((d.nat_actions||[]).filter(x=>x&&x.title&&!live(x)).map(x=>x.title.toLowerCase()));
  const seen=new Set(), out=[];
  for(const n of [...(d.needs||[]),...acts]){if(!n||!n.title||!live(n)||verifying(n)) continue; const k=n.title.toLowerCase(); if(seen.has(k)||gone.has(k)) continue; seen.add(k); out.push(n)}
  const dueKey=n=>isDate(n.due)?ptDay(asDay(n.due)):"9999", tierW=n=>({now:0,week:1,later:2})[String(n.tier||"").toLowerCase()]??1;
  return out.sort((a,b)=>tierW(a)-tierW(b)||dueKey(a).localeCompare(dueKey(b)));
}
const notLater=n=>String(n.tier||"").toLowerCase()!=="later", act=Qn=>Qn.filter(notLater).length;
const dueOf=n=>{if(!isDate(n.due)) return null; const k=ptDay(asDay(n.due)), t=ptDay(NOW()); return {over:k<t,today:k===t,txt:k<t?"overdue":k===t?"today":dayLbl(asDay(n.due))}};

/* ---------- context ---------- */
function moment(d,Qn){
  const now=NOW(), h=ptHour(now), dow=ptDow(now), today=ptDay(now);
  const meets=(d.meetings||[]).filter(m=>m&&isDate(m.when)).sort((a,b)=>new Date(a.when)-new Date(b.when));
  const next=meets.find(m=>{const mu=minsUntil(m.when);return mu>-30&&mu<=45});
  const wk=Qn.find(n=>n.project==="weekly-review");
  if(next) return {kind:"meet",m:next};
  const WR=d.week_review&&d.week_review.show===true?d.week_review:null;
  if((dow==="Sun"||dow==="Sat"||dow==="Mon"&&h<12)&&(wk||WR)) return {kind:"week",n:wk||null,wr:WR};
  if(h>=18||h<4) return {kind:"eve"};
  if(h>=4&&h<10) return {kind:"morning"};
  return {kind:act(Qn)?"decide":"zero"};
}
function greet(k){const h=ptHour(NOW());
  return k==="meet"?"Heads up":h<4?"Still up?":h<12?"Good morning":h<17?"Good afternoon":h<22?"Good evening":"Winding down"}
function broken(d){ // only real breakage; otherwise invisible
  const out=[], age=(Date.now()-new Date(d.updated))/36e5; // real clock, not the simulated ?at
  if(age>3) out.push(`Data is ${Math.round(age)} h old. The feed normally updates every 15 min.`);
  const W=d.watchdog||{}; if((W.stuck||[]).length) out.push(`${W.stuck.length} agent run${W.stuck.length===1?"":"s"} stuck`); if((W.failed_runs||[]).length) out.push(`${W.failed_runs.length} failed run${W.failed_runs.length===1?"":"s"}`);
  const crit=(d.issues||[]).filter(i=>i.severity==="critical"); if(crit.length) out.push(`${crit.length} critical fleet issue${crit.length===1?"":"s"}: ${crit[0].title}`);
  const FP=d.fleet_pacing&&d.fleet_pacing.agents||{}; const st=Object.keys(FP).filter(k=>FP[k]&&FP[k].stalled===true); for(const k of st){const f=FP[k], q=num(f.queue), fl=num(f.in_flight), im=num(f.idle_min), why=[fl>0?`${fl} in flight`:"",q>0?`${q} queued`:"",im!=null?`no run for ${im<90?im+" min":Math.round(im/60)+" h"}`:""].filter(Boolean);
    out.push(`${k[0].toUpperCase()+k.slice(1)} stalled${why.length?" ("+why.join(", ")+")":""}`)}
  return out;
}

/* ---------- pieces ---------- */
const G=d=>(d.goals||{}).progress||{};
function capToday(d){const c=G(d).capacity||{}, t=ptDay(NOW()); return (c.days||[]).find(x=>x&&x.date===t)}
function chips(d,Qn){
  const c=G(d).capacity||{}, cap=num(c.booked_pct_next7), r=G(d).relationships||{}, cc=num(r.coffee_chats_calendar);
  const hot=Qn.filter(notLater).filter(n=>{const u=dueOf(n);return u&&(u.over||u.today)}).length;
  return `<div class="strip">
    <a class="chip ${act(Qn)?hot?"warn":"":"good"}" href="#queue"><div class="v mono">${act(Qn)||"0 ✓"}</div><div class="l">${act(Qn)?`need${act(Qn)===1?"s":""} you${hot?` · ${hot} due`:""}`:"nothing waiting"}</div></a>
    <a class="chip ${cap==null?"":cap<=70?"good":cap<=85?"warn":"bad"}" href="#goals"><div class="v mono">${cap==null?"—":cap+"%"}</div><div class="l">booked, next 7 days · cap 70%</div></a>
    <a class="chip ${cc!=null&&cc>=40?"good":""}" href="#goals"><div class="v mono">${cc==null?"—":cc+"<span class=dim style=font-size:13px>/40</span>"}</div><div class="l">coffee chats by Dec 12</div></a></div>`;
}
function answers(n,i){
  const opts=Array.isArray(n.options)&&n.options.length?n.options:["Done","Later"], u=link(n.url);
  const isOpen=o=>/^open\b|^review\b/i.test(o);
  return `<div class="ans">${opts.filter(o=>!(u&&isOpen(o))).map(o=>`<button type="button" data-a="${esc(o)}" data-i="${i}"${o===n.recommend?' class="rec"':""}>${esc(o)}${o===n.recommend?" ★":""}</button>`).join("")}${u?`<a class="open" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>`:""}</div>`;
}
function needCard(n,i){
  const du=dueOf(n), est=num(n.est_min);
  return `<article class="need${du&&du.over?" over":du&&du.today?" hot":""}" data-card="${i}">
    <div class="t">${esc(n.title)}</div>
    <div class="m">${du?`<span class="due">${esc(du.txt)}</span>`:""}${est!=null&&est>0?`<span>${est} min</span>`:""}${n.project?`<span>${esc(n.project)}</span>`:""}</div>
    ${n.detail?`<div class="d">${esc(n.detail)}</div><button type="button" class="more" data-more>More</button>`:""}
    ${answers(n,i)}</article>`;
}
function nowCard(d,M,Qn){
  const today=ptDay(NOW()), meets=(d.meetings||[]).filter(m=>m&&isDate(m.when)&&ptDay(m.when)===today&&new Date(m.when)>NOW()-30*6e4);
  if(M.kind==="meet"){const m=M.m, mu=minsUntil(m.when), ppl=(m.people||[]);
    return `<section class="now meet">${doodle("meet")}<div class="k">${mu>0?`In ${mu} min · ${esc(tm(m.when))}`:"Happening now"}</div><h2>${esc(m.title)}</h2>
      ${m.location?`<p>📍 ${esc(m.location)}</p>`:""}
      ${ppl.slice(0,2).map(p=>`<p><b>${esc(p.name)}</b>${p.who?` · ${esc(p.who)}`:""}${p.last_time?`<br><span style="opacity:.8">Last time: ${esc(p.last_time)}</span>`:""}</p>`).join("")}
      ${(m.questions||[]).length?`<ul>${m.questions.slice(0,3).map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}
      ${m.id?`<a class="cta" href="classic.html#m-${esc(encodeURIComponent(m.id))}">Full brief →</a>`:""}</section>`}
  if(M.kind==="week"){const n=M.n, i=n?Qn.indexOf(n):-1, W=M.wr, wins=W&&Array.isArray(W.wins)?W.wins.filter(w=>w&&w.text).slice(0,5):[];
    return `<section class="now week">${doodle("week")}<div class="k">${W?`Week in review${W.week_of?" · from "+esc(dayLbl(asDay(W.week_of))):""}`:"Week plan"}</div>
      ${W?`<div class="row2"><div><div class="n mono">${num(W.done)??"—"}</div><div class="l">tasks done this week</div></div>${num(W.planned)!=null?`<div><div class="n mono">${W.planned}</div><div class="l">planned</div></div>`:""}${streakNum(d)?`<div><div class="n mono">🔥 ${streakNum(d)}</div><div class="l">day streak</div></div>`:""}</div>
        ${wins.length?`<div class="k" style="margin-top:14px">Wins</div><ul>${wins.map(w=>`<li>${link(w.url)?`<a href="${esc(link(w.url))}" target="_blank" rel="noopener" >${esc(w.text)}</a>`:esc(w.text)}</li>`).join("")}</ul>`:""}`:""}
      ${n?`<h2 style="margin-top:${W?16:8}px${W?";font-size:19px":""}">${esc(n.title)}</h2>${n.detail?`<p>${esc(n.detail)}</p>`:""}${answers(n,i)}`:""}</section>`}
  if(M.kind==="morning"){const c=capToday(d), first=Qn.find(notLater), nb=(Array.isArray(d.calendar_blocks)?d.calendar_blocks:[]).filter(b=>b&&isDate(b.start)&&ptDay(b.start)===ptDay(NOW())&&new Date(b.start)>NOW()).sort((x,y)=>new Date(x.start)-new Date(y.start))[0];
    return `<section class="now">${doodle("sun")}<div class="k">Today · ${esc(dayLbl(NOW()))}</div>
      <h2>${first?esc(first.title):"A clear morning. Nothing needs you ✨"}</h2>${!first&&nb?`<p>First on the calendar: ${esc(tm(nb.start))} · ${esc(nb.title||({meeting:"Meeting",class:"Class",focus:"Focus"})[nb.kind]||"Busy")}</p>`:""}${first&&dueOf(first)?`<p>${esc(dueOf(first).txt)}${num(first.est_min)?` · about ${first.est_min} min`:""}</p>`:""}
      <div class="row2"><div><div class="n mono">${meets.length}</div><div class="l">meeting${meets.length===1?"":"s"} today</div></div>
        <div><div class="n mono">${act(Qn)}</div><div class="l">need${act(Qn)===1?"s":""} you</div></div>
        <div><div class="n mono" style="color:${c?c.pct>=85?"var(--bad)":c.pct>70?"var(--warn)":"var(--good)":"inherit"}">${c?c.pct+"%":"—"}</div><div class="l">of today booked</div></div></div>
      ${first?`<a class="cta" href="#queue">Start with this →</a>`:""}</section>`}
  if(M.kind==="decide"){const n=Qn[0];
    return `<section class="now decide">${doodle("sun")}<div class="k">${act(Qn)===1?"One decision":"Next decision · "+act(Qn)+" waiting"}</div><h2>${esc(n.title)}</h2>
      ${n.detail?`<p>${esc(String(n.detail).slice(0,220))}${String(n.detail).length>220?"…":""}</p>`:""}${answers(n,0)}</section>`}
  if(M.kind==="zero") return zeroCard(d);
  // evening: what got done, tomorrow's first thing
  const done=(d.agents||[]).reduce((t,a)=>t+(num(a.done_24h)||0),0), decs=(d.decisions||[]).filter(x=>isDate(x.at)&&NOW()-new Date(x.at)<864e5).length;
  const r=G(d).relationships||{}, wk=num(r.coffee_chats_calendar_this_week);
  const tmr=new Date(NOW().getTime()+864e5), tk=ptDay(tmr), tm1=(d.meetings||[]).filter(m=>m&&isDate(m.when)&&ptDay(m.when)===tk).sort((a,b)=>new Date(a.when)-new Date(b.when))[0];
  const tn=Qn.find(n=>{const u=dueOf(n);return u&&(u.over||ptDay(asDay(n.due))<=tk)})||Qn[0];
  return `<section class="now eve">${doodle("moon")}<div class="k">Today, done</div>
    <div class="row2"><div><div class="n mono">${done}</div><div class="l">tasks the fleet finished</div></div><div><div class="n mono">${decs}</div><div class="l">decisions made</div></div>${wk!=null?`<div><div class="n mono">${wk}</div><div class="l">coffee chats this week</div></div>`:""}</div>
    ${(()=>{const WA=(Array.isArray(d.wins)?d.wins:[]).filter(w=>w&&w.text&&(!isDate(w.at)||NOW()-new Date(w.at)<864e5)), W=WA.slice(0,3);
      return W.length?`<div class="k" style="margin-top:16px">Wins</div><ul>${W.map(w=>`<li>${link(w.url)?`<a href="${esc(link(w.url))}" target="_blank" rel="noopener" >${esc(w.text)}</a>`:esc(w.text)}</li>`).join("")}</ul>${WA.length>3?`<p style="font-size:13px;opacity:.75">+${WA.length-3} more today</p>`:""}`:""})()}
    <h2 style="margin-top:16px;font-size:19px">Tomorrow, first: ${tm1?`${esc(tm1.title)} at ${esc(tm(tm1.when))}`:tn?esc(tn.title):"nothing booked yet"}</h2>
    ${act(Qn)?`<p>${act(Qn)} thing${act(Qn)===1?"":"s"} still need${act(Qn)===1?"s":""} you; ${Qn.filter(n=>{const u=dueOf(n);return u&&u.over}).length} overdue.</p>`:`<p>Inbox zero. Enjoy the evening ✨</p>`}</section>`;
}
const streakNum=d=>{const S=d&&d.streak; return S&&num(S.days)>0?S.days:0};
function zeroCard(d){const n=streakNum(d);return `<section class="now zero">${doodle("star")}<div class="k">All clear${n?` · 🔥 ${n}-day streak`:""}</div><h2>Nothing needs you right now ✨</h2><p>${n?`${n} evening${n===1?"":"s"} in a row with nothing waiting. Keep it going.`:"The fleet has it. Check back after your next meeting."}</p></section>`}
function krBlock(d,F){ // career KRs (Nat adopted the UAS KRs 26 Nov); progress from goals.progress.career.uas_krs, loop KR falls back to the funnel
  const pil=((d.goals||{}).pillars||[]).find(p=>p&&p.key==="career"), K=(pil&&Array.isArray(pil.krs)?pil.krs:[]).filter(k=>k&&k.text);
  if(!K.length) return "";
  const U=(G(d).career||{}).uas_krs||{}, pick=re=>{const k=Object.keys(U).find(x=>re.test(x));return k?U[k]:null};
  const prog=k=>{const key=String(k.key||"");
    if(/loop/.test(key)){const u=pick(/loops/);return {now:num(u&&u.now)??num(F.interviewing),tg:num(k.target)??num(u&&u.target)}}
    if(/warm/.test(key)){const u=pick(/warm/);return {now:num(u&&u.now),tg:num(k.target)??num(u&&u.target),note:u&&u.note}}
    if(/apply/.test(key)){const u=pick(/apply/);return {now:num(u&&u.applied),tg:num(u&&u.live_eligible_known),note:u&&u.note,of:"eligible live roles known"}}
    return {now:null,tg:num(k.target)}};
  return `<div class="goal wide"><div class="gk">Career KRs · UAS</div><ul class="krs">${K.map(k=>{const r=prog(k), f=r.now!=null&&r.tg?Math.min(1,r.now/r.tg):null;
    return `<li><div class="kt">${esc(k.text)}</div><div class="kv"><b class="mono">${r.now==null?"—":r.now}${r.tg!=null?`<small>/${r.tg}</small>`:""}</b>${r.of?` <span class="dim">${esc(r.of)}</span>`:""}${isDate(k.by)?` <span class="dim">· by ${esc(dayLbl(asDay(k.by)))}</span>`:""}</div>
      ${f!=null?`<div class="hp" aria-hidden="true"><i style="width:${Math.max(f*100,f>0?2:0).toFixed(1)}%;background:${f>=1?"var(--hp-g)":"var(--hp-b)"}"></i></div>`:""}${r.note?`<div class="dim kn">${esc(r.note)}</div>`:""}</li>`}).join("")}</ul></div>`}
function goals(d){
  const P=G(d), c=P.capacity||{}, cap=num(c.booked_pct_next7), r=P.relationships||{}, cc=num(r.coffee_chats_calendar), k=P.career||{};
  const F=k.funnel&&typeof k.funnel==="object"?k.funnel:{tracked:k.tracked,applied:k.applied,interviewing:k.interviewing,offers:k.offers}; // reconciled funnel wins over the Notion-only counts
  const ring=(v,max,col)=>{const f=Math.max(0,Math.min(1,(v||0)/max));return `<div class="hp" aria-hidden="true"><i style="width:${(f*100).toFixed(1)}%;background:${col}"></i></div>`};
  const days=(c.days||[]).filter(x=>x&&num(x.pct)!=null).slice(0,7);
  const capCol=p=>p>=85?"var(--hp-r)":p>70?"var(--hp-y)":"var(--hp-g)";
  const left=cc==null?null:Math.max(0,40-cc);
  return `<h3 class="sec" id="goals">On track? <span class="c">fall goals</span></h3><div class="goals">
    <div class="goal wide"><div class="gk">Capacity</div><div class="gv mono">${cap==null?"—":cap+"%"} <small>booked · next 7 days · cap 70%</small></div>
      ${cap!=null?`<div class="bar"><i style="width:${Math.min(cap,100)}%;background:${capCol(cap)}"></i><s style="left:70%"></s></div>`:""}
      ${days.length?`<div class="days">${days.map(x=>`<span><i style="height:${Math.max(3,Math.min(x.pct,100))*.34}px;background:${capCol(x.pct)}"></i>${esc(ptDow(asDay(x.date)).slice(0,1))}</span>`).join("")}</div>`:""}
      <div class="gs">${cap==null?"No calendar reading yet":cap<=70?`${70-cap} pts of slack. Room for surprises.`:`${cap-70} pts over. Trim something optional.`}</div></div>
    <div class="goal"><div class="gk">Coffee chats</div><div class="gv mono">${cc==null?"—":cc}<small>/40</small></div>${ring(cc,40,"var(--hp-g)")}<div class="gs">${left==null?"":left===0?"Goal hit 🎉":left===1?"1 more to hit 40 🎯":`${left} to go by Dec 12`}</div></div>
    <div class="goal"><div class="gk">Warm companies</div><div class="gv mono">${num(k.warm_companies)??"—"}<small>/20</small></div>${ring(num(k.warm_companies),20,"var(--hp-b)")}<div class="gs">by Jan 31</div></div>
    ${krBlock(d,F)}
    <div class="goal wide"><div class="gk">Applications</div><div class="funnel">${[["tracked",F.tracked],["applied",F.applied],["interviewing",F.interviewing],["offers",F.offers]].map(([l,v])=>`<div><b class="mono">${num(v)??"—"}</b><span>${l}</span></div>`).join("")}</div>${F.basis?`<div class="gs">${esc(F.basis)}</div>`:""}</div>
  </div>`;
}
/* ---------- today & tomorrow (side column on desktop) ---------- */
function dayPlan(d){
  const c=G(d).capacity||{}, days=c.days||[], mk=off=>{const t=new Date(NOW().getTime()+off*864e5), k=ptDay(t);
    const ms=(d.meetings||[]).filter(m=>m&&isDate(m.when)&&ptDay(m.when)===k).sort((a,b)=>new Date(a.when)-new Date(b.when));
    const bl=(Array.isArray(d.calendar_blocks)?d.calendar_blocks:[]).filter(b=>b&&isDate(b.start)&&ptDay(b.start)===k&&!ms.some(m=>Math.abs(new Date(m.when)-new Date(b.start))<6e4));
    const cd=days.find(x=>x&&x.date===k); return {k,t,ms,bl,pct:cd?num(cd.pct):null}};
  const D2=[mk(0),mk(1)], capCol=p=>p>=85?"var(--hp-r)":p>70?"var(--hp-y)":"var(--hp-g)";

  const pick=re=>{const c=C[SEL]; if(!c) return; const bs=[...c.querySelectorAll(".ans button:not(:disabled)")]; const b=bs.find(x=>re.test(x.textContent.trim()))||(re.source.includes("done")?bs[0]:null); if(b) b.click()};
  if(e.key==="j"||e.key==="k"){SEL=Math.max(0,Math.min(C.length-1,SEL+(e.key==="j"?1:-1))); C.forEach((c,i)=>c.classList.toggle("sel",i===SEL)); C[SEL].scrollIntoView({block:"nearest",behavior:"smooth"}); e.preventDefault()}
  else if(e.key==="d"){if(SEL<0){SEL=0;C[0].classList.add("sel")} pick(/^(done|accept|yes|approve|ok)/i)}
  else if(e.key==="s"){if(SEL<0){SEL=0;C[0].classList.add("sel")} pick(/^(skip|later|no|not now)/i)}
});
addEventListener("hashchange",()=>{if(D){render();scrollTo(0,0)}});
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}

/* ---------- overworld strip + level-up (original pixel art) ---------- */
const TILES={
  grass:["gggggggg","gGgggggg","ggggggGg","gggggggg","ggGggggg","gggggGgg","gggggggg","gGgggggg"],
  meeting:["...rr...","..rrrr..",".rrrrrr.","rrrrrrrr",".wwwwww.",".wwddww.",".wwddww.","gggggggg"],
  class:["..yyyy..",".yyyyyy.","yyyyyyyy",".wwwwww.",".wbwwbw.",".wwddww.",".wwddww.","gggggggg"],
  focus:["...LL...","..LLLL..",".LLLLLL.","LLLLLLLL",".LLLLLL.","...bb...","...bb...","gggggggg"]};
const TPAL={g:"#7ccf5a",G:"#5aa83e",r:"#e0524a",w:"#fff4dc",d:"#7a4a24",y:"#f0b828",b:"#7a4a24",L:"#2f8f3a"};
const HERO=["..aaaa..",".aaaaaa.","..ffff..","..fEfE..","..ffff..",".cccccc.","c.cccc.c","..cccc..","..p..p..","..p..p.."];
function ptHM(t){const P=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date(t));
  const g=k=>Number((P.find(x=>x.type===k)||{}).value); return g("hour")+g("minute")/60}
function overworld(x,today){
  const H0=7,H1=23, spans=[...x.bl.filter(b=>isDate(b.end)).map(b=>({a:ptHM(b.start),z:ptHM(b.end)||24,k:b.kind||"meeting"})),...x.ms.map(m=>({a:ptHM(m.when),z:ptHM(m.when)+1,k:"meeting"}))];
  const cells=[];for(let h=H0;h<H1;h++){const hit=spans.find(s=>s.a<h+1&&s.z>h); cells.push(hit&&TILES[hit.k]?hit.k:"grass")}
  const busy=cells.filter(c=>c!=="grass").length, now=today?ptHM(NOW()):null, pos=now!=null&&now>=H0&&now<H1?((now-H0)/(H1-H0)*100):null;
  return `<div class="ow" role="img" aria-label="${busy} of ${H1-H0} hours between 7 AM and 11 PM have something on">
    <div class="ow-row">${cells.map(c=>`<span class="ow-t">${pxsvg(TILES[c],TPAL,"",16,16)}</span>`).join("")}</div>
    ${pos!=null?`<span class="ow-hero" style="left:${pos.toFixed(1)}%">${pxsvg(HERO,{a:"#3a5ccc",f:"#ffd9b0",E:"#1d2129",c:"#ff6b6b",p:"#1d2129"},"",16,20)}</span>`:""}
    <div class="ow-ax"><span>7a</span><span>11a</span><span>3p</span><span>7p</span><span>11p</span></div></div>`}
function lvlUp(n){const star=["...XX...","...YY...","..XYYX..","XXYYYYXX",".XYYYYX.","..XYYX..",".XYXXYX.","XX....XX"];
  return `<div class="lvl"><span class="sp s1"></span><span class="sp s2"></span><span class="sp s3"></span>${pxsvg(star,{X:"#1d2129",Y:"#ffd23f"},"lvl-star",48,48)}
    <div class="lvl-t">Level up!</div>${n?`<div class="lvl-lv">LV ${esc(n)} · ${esc(n)}-day streak</div>`:""}</div>`}
function pxsvg(rows,pal,cls,w,h){ // rows: strings of palette keys; "." is transparent; horizontal runs merge into one rect
  let r="";rows.forEach((row,y)=>{let x=0;while(x<row.length){const c=row[x];let n=1;while(row[x+n]===c)n++;if(c!=="."&&pal[c])r+=`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[c]}"/>`;x+=n}});
  return `<svg class="${cls}" viewBox="0 0 ${rows[0].length} ${rows.length}" width="${w}" height="${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const DOODLES={
  sun:[".....y..y.....","..y........y..",".....XXXX.....","....XYYYYX....","y..XYYYYYYX..y","...XYEYYEYX...","...XYYYYYYX...","y..XYcMMcYX..y","....XYYYYX....",".....XXXX.....","..y........y..",".....y..y....."],
  moon:["....XXXX......","..XXMMMX...w..",".XMMMMX.......",".XMMMX......w.","XMMMX.........","XMEMX....w....","XMMMX.........","XMMMMX........",".XMMMMXXXX....",".XMMMMMMMMX...","..XXMMMMXX....","....XXXX......"],
  star:[".....XX.....",".....YX.....","....XYYX....","XXXXYYYYXXXX","XYYYEYYEYYYX",".XYYYYYYYYX.","..XYYMMYYX..","..XYYYYYYX..",".XYYYXXYYYX.",".XYYX..XYYX.","XYYX....XYYX","XXX......XXX"],
  meet:["............",".XXXXXXXXXX.","XWWWWWWWWWWX","XWWWWWWWWWWX","XWWEWWEWWEWX","XWWWWWWWWWWX",".XXXXXXXXXX.","..XWX.......","..XX........","............"],
  week:[".XX....XX...","XXXXXXXXXXXX","XRRRRRRRRRRX","XRRRRRRRRRRX","XXXXXXXXXXXX","XWWWWWWWWWWX","XWWWWWWWWGWX","XWWWWWWWGWWX","XWGWWWWGWWWX","XWWGWWGWWWWX","XWWWGGWWWWWX","XXXXXXXXXXXX"]};
function doodle(k){const pal={X:"#1d2129",Y:"#ffd23f",y:"#f0a020",E:"#1d2129",M:"#ffe9a8",c:"#ff7a9c",w:"#ffffff",W:"#ffffff",R:"#ff6b6b",G:"#2f9e44"};
  if(k==="star"){pal.M="#1d2129"} if(k==="moon"){pal.E="#1d2129"}
  return pxsvg(DOODLES[k]||DOODLES.star,pal,"doodle",64,64)}
function face(r){ // a little original creature; expression shows status; body and topper vary per agent
  const h=HUE(r.key), st=r.st;
  const g=["..............","..............","......XXXX....","....XXooooXX..","...XooooooooX.","...XooooooooX.","..XooooooooooX","..XooooooooooX","..XooooooooooX","..XooooooooooX","...XooooooooX.","...XooooooooX.","....XXXXXXXX..","....XX....XX.."].map(x=>x.split(""));
  const set=(y,x,c)=>{if(g[y]&&g[y][x]!==undefined)g[y][x]=c};
  const top=(h>>3)%4; // 0 none, 1 ears, 2 antenna, 3 sprout
  if(top===1){set(1,3,"X");set(2,3,"X");set(2,4,"o");set(1,12,"X");set(2,12,"X");set(2,11,"o");set(3,3,".");}
  if(top===2){set(0,8,"a");set(1,8,"X")}
  if(top===3){set(0,7,"g");set(0,9,"g");set(1,8,"g")}
  for(let y=6;y<12;y++)for(let x=0;x<14;x++) if(g[y][x]==="o"&&(g[y][x+1]==="X"||y===11)) g[y][x]="s";
  const eyes=(c)=>{set(6,5,c);set(7,5,c);set(6,10,c);set(7,10,c)};
  if(st==="working"){eyes("E");set(6,5,"w");set(6,10,"w");set(8,4,"c");set(8,11,"c");set(9,6,"E");set(9,9,"E");set(10,7,"E");set(10,8,"E")}
  else if(st==="stalled"){eyes("E");set(5,4,"E");set(4,5,"E");set(5,11,"E");set(4,10,"E");set(10,5,"E");set(9,6,"E");set(10,7,"E");set(9,8,"E");set(10,9,"E");set(5,12,"b");set(6,12,"b")}
  else if(st==="idle"||st==="paused"){set(7,4,"E");set(7,5,"E");set(7,10,"E");set(7,11,"E");set(8,4,"c");set(8,11,"c");set(10,7,"E")}
  else {eyes("E");set(10,6,"E");set(10,7,"E");set(10,8,"E");set(10,9,"E")}
  const pal={X:"#1d2129",o:`hsl(${h} 78% 66%)`,s:`hsl(${h} 60% 50%)`,E:"#1d2129",w:"#ffffff",c:"#ff8fab",a:"#ff4d6d",g:"#38b048",b:"#5ab4ff"};
  return pxsvg(g.map(x=>x.join("")),pal,"spr",48,48)+(st==="idle"?`<span class="z">z</span>`:st==="paused"?`<span class="z">II</span>`:"")}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=document.createElement("div"); box.className="confetti"; const C=["#ffd23f","#38b048","#5ab4ff","#ff6b6b","#b18cff","#ff9f43"];
  box.innerHTML=Array.from({length:36},(_,k)=>{const a=Math.random()*Math.PI*2, d=120+Math.random()*220;
    return `<i style="background:${C[k%C.length]};--x:${Math.round(Math.cos(a)*d)}px;--y:${Math.round(Math.sin(a)*d-80)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-delay:${Math.round(Math.random()*120)}ms"></i>`}).join("");
  document.body.appendChild(box); setTimeout(()=>box.remove(),1600);
}
let TYPED=false;
function typeOn(){if(TYPED) return; TYPED=true; const h=document.querySelector(".now h2"); if(!h||h.children.length||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const full=h.textContent; h.setAttribute("aria-label",full); let n=0; h.textContent=""; const t=setInterval(()=>{n+=2; h.textContent=full.slice(0,n); if(n>=full.length){clearInterval(t);h.removeAttribute("aria-label")}},22)}
function celebrate(){const p=document.getElementById("pop");p.classList.add("on");setTimeout(()=>p.classList.remove("on"),900)}
function clearCard(btn){const c=btn.closest(".need")||btn.closest(".now"); if(c&&c.classList.contains("need")){c.classList.add("done");setTimeout(()=>{c.remove();const left=document.querySelectorAll(".q .need").length; if(!left){confetti();document.querySelector(".q").innerHTML=`<div class="zeroq">${lvlUp(streakNum(D))}<b>Inbox zero</b>Nothing is waiting on you.</div>`}},460)}
  else if(c){c.style.opacity=".6"; c.querySelectorAll(".ans button").forEach(b=>b.disabled=true)}}
async function answer(btn,n,pick){
  if(!n) return; btn.classList.remove("wiggle"); void btn.offsetWidth; btn.classList.add("wiggle"); const title="HQ answer: "+n.title+" → "+pick;
  if(ONE){btn.disabled=true;const o=btn.textContent;btn.textContent="Sending…";
    try{const r=await fetch("/api/answer",{method:"POST",headers:{"Content-Type":"application/json","X-HQ":"1"},body:JSON.stringify({title,body:"Answer from HQ v2: "+pick})});
      if(!r.ok) throw r.status; celebrate(); clearCard(btn); toast("Sent ✓");}
    catch(_){btn.disabled=false;btn.textContent=o;ONE=false;toast("One-tap send failed. Tap again to finish on GitHub")} return}
  const u=ISSUE_NEW+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Tap Submit to send this to the autopilot supervisor.");
  let w=null;try{w=window.open(u,"_blank")}catch(_){} if(w){try{w.opener=null}catch(_){}celebrate();clearCard(btn);toast("Opened GitHub: tap Submit")} else toast("Couldn't open GitHub");
}
function probe(){fetch("/api/answer",{method:"POST",headers:{"Content-Type":"application/json","X-HQ":"1"},body:'{"title":""}'}).then(r=>{ONE=r.status===400}).catch(()=>{ONE=false})}
function load(){return fetchData().then(d=>{D=d; if(typeof d.one_click==="boolean") ONE=d.one_click; else if(ONE==null) probe();
  try{render();typeOn()}catch(e){document.getElementById("app").innerHTML=`<p class="err">HQ v2 hit a display error (${esc(e.message)}). <a href="classic.html">Open classic HQ</a></p>`}})
  .catch(()=>{if(!D) document.getElementById("app").innerHTML=`<p class="err">Couldn't load status data. <a href="classic.html">Open classic HQ</a></p>`})}
load(); setInterval(()=>{if(document.visibilityState==="visible") load()},5*6e4);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") load()});
