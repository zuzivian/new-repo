<meta charset="utf-8">
<title>Autopilot HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a cockpit panel. Fuel gauge for the week up top, then "needs you", meetings, crew (workers), burn by project. One column on phones, two on desktop. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#122033; --ink-2:#4a5b70; --line:#d6dde6;
  --accent:#c77700; --accent-soft:#fff1db; --good:#1f8a4c; --warn:#b26b00; --bad:#c0392b;
  --core:#2b6cb0; --surface:#7b5ea7; --growth:#c77700; --maint:#8795a6; --track:#e3e8ef;
  --f-display:"Barlow Semi Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1320; --panel:#111c2d; --ink:#e7edf5; --ink-2:#9fb0c4; --line:#22324a;
  --accent:#ffb13b; --accent-soft:#2a2112; --good:#4cc283; --warn:#ffb13b; --bad:#ff6b5e;
  --core:#6aa8ff; --surface:#b294e0; --growth:#ffb13b; --maint:#7d8da2; --track:#1c2a40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1320; --panel:#111c2d; --ink:#e7edf5; --ink-2:#9fb0c4; --line:#22324a;
  --accent:#ffb13b; --accent-soft:#2a2112; --good:#4cc283; --warn:#ffb13b; --bad:#ff6b5e;
  --core:#6aa8ff; --surface:#b294e0; --growth:#ffb13b; --maint:#7d8da2; --track:#1c2a40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.wrap>*,#view{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.muted{color:var(--ink-2)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.grid{grid-template-columns:1.25fr 1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.gauge-top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.stat{display:grid;gap:2px}.stat b{font-family:var(--f-mono);font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
svg text{fill:var(--ink-2);font-family:var(--f-mono);font-size:10px}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.bar5{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px}
.bar5>i{display:block;height:100%;background:var(--accent)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-left:4px solid var(--st);border-radius:8px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.tile .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .st{font-size:12px;color:var(--st);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile .ct{font-size:12px;color:var(--ink-2)}
.legend-st{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend-st i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--st)}
.panel{overflow-wrap:anywhere}.cards>*,.rows>*,.row>*{min-width:0}.row .name{overflow:hidden;text-overflow:ellipsis}
.sevbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sev{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;border:1px solid var(--sv);color:var(--sv)}
.iss{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
.iss:first-of-type{border-top:0}
.iss .dot{width:10px;height:10px;border-radius:50%;background:var(--sv);margin-top:5px}
.iss .meta{font-size:12px;color:var(--ink-2)}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.agent{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.agent .av{position:relative;width:44px;height:44px}
.agent .av svg{width:44px;height:44px;display:block}
.agent .av .pip{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--sc);border:2px solid var(--panel)}
.agent .nm{font-weight:700;line-height:1.1}
.agent .rl{font-size:11px;color:var(--ink-2);line-height:1.2}
.agent .dg{font-size:12px;line-height:1.25;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.agent .sx{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sc)}
@media (prefers-reduced-motion:no-preference){.agent[data-s="working"] .av svg{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-2px)}}
/* Phone layout: what needs Nat first, agents as a swipeable strip, chart and cost further down. */
@media (max-width:640px){
  body{font-size:15px}
  .agents{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .agents::-webkit-scrollbar{display:none}
  .agent{flex:0 0 72%;scroll-snap-align:start}
  .grid{display:flex;flex-direction:column;gap:12px}
  .grid>section[aria-labelledby="n"]{order:-5}
  .grid>section[aria-labelledby="is"]{order:-4}
  .grid>section[aria-labelledby="pb"]{order:-3}
  .grid>section[aria-labelledby="mt"]{order:-2}
  .grid>section[aria-labelledby="g"]{order:-1}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reply{display:flex;flex-wrap:wrap;gap:8px}
  .reply button{min-height:44px;flex:1 1 40%}
  .need a,.iss a{display:inline-block;padding:4px 0}
}
button.tile,button.iss{font:inherit;color:inherit;background:none;text-align:left;cursor:pointer;width:100%}
button.tile:hover,button.iss:hover{background:var(--track)}
button.tile:focus-visible,button.iss:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.iss{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 2px;min-height:44px}
button.iss:first-of-type{border-top:0}
button.iss .dot{margin-top:0}
.chev{color:var(--ink-2);font-size:20px;line-height:1}
dialog.pop{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100% - 32px));max-height:min(80vh,720px)}
dialog.pop::backdrop{background:rgba(5,10,20,.55)}
.pop .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.pop .hd h3{margin:0;font-size:18px;line-height:1.25}
.pop .bd{padding:0 16px 16px;display:grid;gap:10px;overflow:auto}
.pop .x{font:inherit;font-size:22px;line-height:1;background:none;border:0;color:var(--ink-2);cursor:pointer;min-width:44px;min-height:44px}
.pop .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px}
.pop .kv dt{color:var(--ink-2)}.pop .kv dd{margin:0}
.pop .lst{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.pop .lst li{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media (max-width:640px){dialog.pop{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:85vh}}
.agent{position:relative;grid-template-columns:52px 1fr}
.agent .av{width:52px;height:52px}
.agent .av .ring{position:absolute;inset:0;width:52px;height:52px}
.agent .av .face{position:absolute;left:6px;top:6px;width:40px;height:40px}
.agent .av .face svg{width:40px;height:40px}
.agent .av .pc{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);font-size:10px;line-height:1;padding:2px 4px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.agent .av .pip{right:0;top:0;bottom:auto}
.agent .av .pc.nf{white-space:nowrap;font-style:italic;letter-spacing:-.02em;padding:2px 3px}
.agent.nofeed .av .face{opacity:.78}
.agent .tip .nf-note{font-size:12px;border-top:1px dashed var(--line);padding-top:6px}
.agent .tip .asof{font-size:11px}
.stale{color:var(--warn)}
header .idea{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;margin-left:auto}
header .idea:hover{border-color:var(--accent)} header .idea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pop textarea{font:inherit;width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical}
.pop .act{display:flex;gap:8px;flex-wrap:wrap}
.pop .act button{font:inherit;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pop .act button.pri{background:var(--accent);border-color:var(--accent);color:#1b1206;font-weight:600}
.agent:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.agent .tip{position:absolute;z-index:6;left:8px;top:calc(100% + 6px);width:220px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s}
.agent .tip::before{content:"";position:absolute;left:22px;top:-6px;width:10px;height:10px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.agent:hover .tip,.agent:focus-within .tip{opacity:1;visibility:visible;transform:none}
.agent .tip .tt{display:flex;justify-content:space-between;gap:8px}
.agent .tip .spark{width:100%;height:44px}
@media (prefers-reduced-motion:reduce){.agent .tip{transition:none}}
@media (max-width:640px){.agent .tip{display:none}}
.tt{display:flex;justify-content:space-between;gap:8px}.pop .tt b{display:none}.pop .tt .mono{font-size:22px;font-weight:600}.pop .spark{width:100%;height:64px}
.cards{display:grid;gap:10px}
/* Goals: one row of pillar tiles, the first thing on the page. */
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:860px){.goals{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.goal{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gs);border-radius:10px;padding:10px 12px;display:grid;gap:4px;min-width:0;min-height:44px}
.goal:hover{border-color:var(--accent);border-top-color:var(--gs)} .goal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.goal .gk{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.goal .gv{font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1.1}.goal .gv small{font-size:13px;color:var(--ink-2);font-weight:400}
.goal .gm{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .gp{font-size:12px;font-weight:600;color:var(--gs)}
.goal.nf .gv{font-size:15px;font-style:italic;font-family:var(--f-body);color:var(--ink-2);font-weight:500}
.goal.nf .gp{color:var(--ink-2);font-weight:500}
.gbar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}.gbar>i{display:block;height:100%;background:var(--gs)}
.goal.nf .gbar{background:repeating-linear-gradient(90deg,var(--track) 0 6px,transparent 6px 10px)}
/* This week: one timeline of deadlines, meetings and top tasks. */
.wk{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.wk li{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.wk li:first-child{border-top:0}
.wk .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}.wk .d.today{color:var(--accent);font-weight:600}
.wk .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.wk a{color:inherit;text-decoration:none}.wk a:hover{color:var(--accent)}
.wk .od{color:var(--bad)}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;min-width:0}
.card.need{border-left:4px solid var(--accent);background:var(--accent-soft)}
.card .t{font-weight:600}
.reply{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.code{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 8px;cursor:pointer}
button.code:hover{border-color:var(--accent)} button.code:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.hbar>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
a{color:var(--core)}
.meet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;text-decoration:none;color:inherit}
.meet .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);min-width:74px}
.meet:hover .t{color:var(--accent)}
.primer{display:grid;gap:14px}
.primer ol{margin:0;padding-left:20px;display:grid;gap:6px}
.primer ul{margin:0;padding-left:18px}
.back{font-size:14px}
.empty{color:var(--ink-2);font-style:italic}
@media (prefers-reduced-motion:no-preference){.hbar>i,.bar5>i{transition:width .6s ease}}
</style>

<div class="wrap" id="app">
  <header>
    <h1>Autopilot HQ</h1>
    <span class="muted mono" id="updated">loading…</span>
    <button type="button" class="idea" id="idea">+ Suggest an HQ change</button>
  </header>
  <div id="view"></div>
</div>

<script>
const TIER_COLOR={"career-core":"var(--core)","career-surface":"var(--surface)","growth":"var(--growth)","maintenance":"var(--maint)"};
const TIER_LABEL={"career-core":"Career core","career-surface":"Career surface","growth":"Growth & joy","maintenance":"Maintenance"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PT={timeZone:"America/Los_Angeles"};
const fmtT=iso=>new Date(iso).toLocaleString("en-US",{...PT,weekday:"short",hour:"numeric",minute:"2-digit"});
let DATA=null;

function target(hLeft,p){ // mirrors autopilot/pace.py
  if(hLeft<=p.final_sweep_hours) return p.weekly_target;
  const ramp=p.ramp_start_hours_before_reset, slow=p.slow_phase_target;
  if(hLeft>=ramp) return slow*Math.min(Math.max((168-hLeft)/(168-ramp),0),1);
  return slow+(p.weekly_target-slow)*(1-hLeft/ramp);
}

function gaugeChart(d){
  const W=640,H=200,L=34,R=10,T=10,B=26, reset=new Date(d.week.reset).getTime(), start=reset-168*3600e3;
  const x=t=>L+(t-start)/(168*3600e3)*(W-L-R), y=v=>T+(1-v)*(H-T-B);
  let tp=""; for(let h=168;h>=0;h-=2){const t=reset-h*3600e3; tp+=(tp?"L":"M")+x(t).toFixed(1)+","+y(target(h,d.pacing)).toFixed(1);}
  const pts=d.week.timeline.map(p=>[new Date(p.t).getTime(),p.u7]);
  let ap=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join("");
  const last=pts[pts.length-1], now=new Date(d.updated).getTime();
  const area=pts.length?ap+`L${x(last[0]).toFixed(1)},${y(0)}L${x(pts[0][0]).toFixed(1)},${y(0)}Z`:"";
  const days=["Sat","Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let grid=""; for(let i=0;i<=7;i++){const gx=x(start+i*86400e3); grid+=`<line x1="${gx}" x2="${gx}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/><text x="${gx}" y="${H-8}" text-anchor="middle">${days[i]}</text>`;}
  for(const v of [0,.25,.5,.75,1]) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v?2:0} 3"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v*100}%</text>`;
  const fast=x(reset-d.pacing.ramp_start_hours_before_reset*3600e3);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly usage against the pacing target">
  ${grid}<rect x="${fast}" y="${T}" width="${W-R-fast}" height="${H-T-B}" fill="var(--accent)" opacity=".06"/>
  <text x="${fast+4}" y="${T+11}">fast phase</text>
  <path d="${tp}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4"/>
  ${area?`<path d="${area}" fill="var(--core)" opacity=".15"/>`:""}
  <path d="${ap}" fill="none" stroke="var(--core)" stroke-width="2.5"/>
  ${last?`<circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="var(--core)"/>`:""}
  <line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H-B}" stroke="var(--accent)" stroke-width="1.5"/>
  </svg>
  <div class="legend"><span><i class="dot" style="background:var(--core)"></i>Used</span><span><i class="dot" style="background:var(--ink-2)"></i>Target (dashed)</span><span><i class="dot" style="background:var(--accent)"></i>Now</span></div>`;
}

function proChart(d){ // Pro account: cumulative new tokens over the same Sat-Sat week as the gauge above (plan % isn't visible for Pro)
  const tl=d.cost&&d.cost.pro&&d.cost.pro.timeline; if(!tl||!tl.length) return "";
  const W=640,H=130,L=34,R=10,T=10,B=22, reset=new Date(d.week.reset).getTime(), start=reset-168*3600e3, x=t=>L+(t-start)/(168*3600e3)*(W-L-R);
  let cum=0,cr=0; const pts=[[start,0]]; tl.forEach(b=>{const t=new Date(b.t).getTime(); if(t<start||t>reset) return; pts.push([t,cum]); cum+=b.new; cr+=b.cache_read; pts.push([t,cum])});
  if(pts.length<2) return "";
  const now=Math.min(new Date(d.updated).getTime(),reset); pts.push([now,cum]);
  const max=Math.max(cum,1), y=v=>T+(1-v/max)*(H-T-B), tok=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(n);
  const days=["Sat","Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; let grid="";
  for(let i=0;i<=7;i++){const gx=x(start+i*86400e3); grid+=`<line x1="${gx}" x2="${gx}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><text x="${gx}" y="${H-6}" text-anchor="middle">${days[i]}</text>`}
  for(const f of [0,.5,1]) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-dasharray="${f?2:0} 3"/><text x="${L-6}" y="${y(max*f)+3}" text-anchor="end">${tok(max*f)}</text>`;
  const line=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join(""), last=pts[pts.length-1];
  return `<h2 style="margin-top:16px">Pro account · tokens this week</h2>

/* ---------- Goals (north star): pillar tiles + one 14-day timeline. Everything renders from data; nulls read "no feed yet", never 0. ---------- */

const ptDay=t=>new Date(t).toLocaleDateString("en-CA",PT); // YYYY-MM-DD in PT

function pillarRead(p,prog,d){

  const keys=Object.keys(T).filter(k=>tnum(T[k])!=null);

  if(!m) return {m:null};

  let cur=num(g[m]); if(cur==null&&weekly) cur=num(g[base+"_this_week"]); if(cur==null&&!weekly) cur=num(g[base]);
  const dl=[T[m]&&T[m].by,T[m+"_by"],T.by,T.deadline,T.fall_end].find(isDate);

  const G=d.goals||{}, P=G.progress||{}, now=new Date(d.updated||Date.now()), end=now.getTime()+14*dayMs, today=ptDay(now);
  const items=[];
  (G.dates||[]).forEach(x=>isDate(x.date)&&items.push({t:asDay(x.date),title:x.title,k:"date"}));
  ((P.career&&P.career.next_deadlines)||[]).forEach(x=>isDate(x.date)&&items.push({t:asDay(x.date),title:x.title,k:"career"}));
  (d.meetings||[]).forEach(m=>isDate(m.when)&&items.push({t:m.when,title:m.title,k:"meeting",href:"#m-"+m.id,time:true}));
  const tk=P.tasks||{};
  (tk.top||[]).forEach(x=>items.push({t:isDate(x.due)?asDay(x.due):null,title:x.title,k:"task"}));
  const inWin=items.filter(x=>!x.t||(new Date(x.t)<=end&&(ptDay(x.t)>=today||x.k==="task")));
  inWin.sort((a,b)=>(a.t?new Date(a.t):Infinity)-(b.t?new Date(b.t):Infinity));
  const seen=new Set(), list=inWin.filter(x=>{const key=(x.t||"").slice(0,10)+"|"+x.title;if(seen.has(key))return false;seen.add(key);return true}).slice(0,12);
  const sub=[num(tk.due_this_week)!=null?`${tk.due_this_week} tasks due`:"",num(tk.overdue)?`<span class="od">${tk.overdue} overdue</span>`:""].filter(Boolean).join(" · ");
  const row=x=>{const od=x.t&&ptDay(x.t)<today, dd=x.t?(ptDay(x.t)===today?"Today":fmtD(x.t)):"—";
    const ttl=x.href?`<a href="${esc(x.href)}">${esc(x.title)}</a>`:esc(x.title);
    return `<li><span class="d${dd==="Today"?" today":""}${od?" od":""}">${esc(dd)}${x.time?`<br>${esc(new Date(x.t).toLocaleTimeString("en-US",{...PT,hour:"numeric",minute:"2-digit"}))}`:""}</span><span>${ttl}</span><span class="k">${x.k}</span></li>`};
  return `<section class="panel" aria-labelledby="wk"><h2 id="wk">Next 14 days${sub?` · <span style="text-transform:none;letter-spacing:0;font-weight:500">${sub}</span>`:""}</h2>
    ${list.length?`<ul class="wk">${list.map(row).join("")}</ul>`:`<div class="empty">Nothing dated in the next two weeks.</div>`}
    ${!G.progress?`<p class="muted" style="margin:8px 0 0;font-size:12px">Tasks and career deadlines appear once the Notion feed lands.</p>`:""}</section>`;
}
function home(d){
  const u=d.week.u7, t=target((new Date(d.week.reset)-new Date(d.updated))/3600e3,d.pacing), gap=u-t;
  const state=gap>=-0.03?["good","On pace"]:gap>=-0.10?["warn","Behind"]:["bad","Well behind"];
  const needs=d.needs.length?d.needs.map((n,i)=>`<div class="card need"><div class="t">${i+1}. ${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)} ↗</a>`:esc(n.title)}</div><div class="muted">${esc(n.detail||n.note||"")}</div>${n.preview?`<div><a href="${esc(n.preview)}" target="_blank" rel="noopener">▶ Open preview</a></div>`:`<div class="muted">No preview available</div>`}
     <div class="reply">${(n.options||["Done","Later"]).map(o=>`<button class="code" data-copy="${esc((i+1)+" → "+o)}" data-title="${esc(n.title)}">${esc(o)}${o===n.recommend?" ★":""}</button>`).join("")}</div></div>`).join("")
     :`<div class="empty">Nothing waiting on you.</div>`;
  const crew=d.workers.length?d.workers.map(w=>`<div class="row"><span class="name">${esc(w.project)} <span class="muted">· ${esc(w.task)}</span></span>${(()=>{const st=String(w.status||w.state||"").toLowerCase();return `<span class="pill ${st==="working"||st==="running"?"warn":st.includes("block")?"bad":st.startsWith("queued")?"":"good"}">${esc(w.status||w.state||"—")}</span>`})()}</div>`).join(""):`<div class="empty">No workers running.</div>`;
  const maxc=Math.max(...d.spend.map(s=>s.usd),1);
  const spend=d.spend.map(s=>`<div class="row"><span class="name">${esc(s.project)}</span><span class="mono muted">$${s.usd.toFixed(0)}</span></div><div class="hbar"><i style="width:${(s.usd/maxc*100).toFixed(1)}%;background:${TIER_COLOR[s.tier]||"var(--maint)"}"></i></div>`).join("");
  const tierTot={}; d.spend.forEach(s=>tierTot[s.tier]=(tierTot[s.tier]||0)+s.usd); const tsum=Object.values(tierTot).reduce((a,b)=>a+b,0)||1;
  const tiers=Object.entries(d.allocation).map(([k,v])=>`<div class="row"><span class="name"><i class="dot" style="background:${TIER_COLOR[k]}"></i>${TIER_LABEL[k]||k}</span><span class="mono">${Math.round((tierTot[k]||0)/tsum*100)}% <span class="muted">/ ${Math.round(v*100)}% plan</span></span></div>`).join("");
  return `${goalsHtml(d)}<div class="grid" style="margin-bottom:16px">
   <section class="panel" aria-labelledby="n"><h2 id="n">Needs you · ${d.needs.length}</h2>
     <div class="cards">${needs}</div>
     ${d.needs.length?`<p class="muted" style="margin:10px 0 0;font-size:13px">Tap an answer to send it straight to the autopilot (the first tap asks you to allow the Claude Code Remote connector; if sending fails it copies instead). ★ = my pick.</p>`:""}</section>
   ${weekHtml(d)}
  </div>${agentsHtml(d.agents)}<div class="grid">
   <section class="panel" aria-labelledby="g"><h2 id="g">Weekly fuel · Stanford account</h2>
     <div class="gauge-top"><div class="big mono">${Math.round(u*100)}%</div>
       <div class="stat"><span class="muted">Target now</span><b>${Math.round(t*100)}%</b></div>
       <div class="stat"><span class="muted">Resets</span><b>${esc(fmtT(d.week.reset))}</b></div>
       <span class="pill ${state[0]}">${state[1]}</span></div>
     ${typeof d.week.u5==="number"&&isFinite(d.week.u5)?`<div class="muted" style="margin-top:10px">5-hour window · ${Math.round(d.week.u5*100)}%${typeof d.pacing.five_hour_ceiling==="number"?` <span class="mono">(ceiling ${Math.round(d.pacing.five_hour_ceiling*100)}%)</span>`:""}</div>
     <div class="bar5"><i style="width:${Math.min(d.week.u5*100,100)}%"></i></div>`:`<div class="muted" style="margin-top:10px">5-hour window · <i>no reading yet</i></div>`}
     ${gaugeChart(d)}${proChart(d)}</section>
   <section class="panel" aria-labelledby="pb"><h2 id="pb">Projects</h2>${boardHtml(d.board)}</section>
   <section class="panel" aria-labelledby="is"><h2 id="is">Fleet issues · ${(d.issues||[]).length}</h2>${issuesHtml(d.issues)}</section>
   <section class="panel" aria-labelledby="c"><h2 id="c">Crew</h2><div class="rows">${crew}</div></section>
   <section class="panel" aria-labelledby="c"><h2 id="c">API-equivalent cost · this week · $${(d.cost&&d.cost.total||0).toFixed(0)}</h2>
     ${costHtml(d.cost)}
     <p class="muted" style="margin:10px 0 0;font-size:13px">What these tokens would cost at API list prices (Claude Code's own estimate per session). Plan usage, not a bill.</p></section>
   <section class="panel" aria-labelledby="s"><h2 id="s">Burn by project · sessions started this week</h2><div class="rows">${spend}</div>
     <div class="rows" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">${tiers}</div></section>
  </div>`;
}

function primer(m){
  if(!m) return `<a class="back" href="#">← Back</a><p class="empty">That primer isn't ready yet.</p>`;
  const people=(m.people||[]).map(p=>`<div class="card"><div class="t">${esc(p.name)}</div><div>${esc(p.who)}</div>
     <div><b>Last time:</b> ${esc(p.last_time)}</div>
     ${p.open_loops?.length?`<div><b>Open loops</b><ul>${p.open_loops.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
     ${p.their_world?`<div><b>Their world:</b> ${esc(p.their_world)}</div>`:""}
     ${p.pipeline?`<div><b>Pipeline:</b> ${esc(p.pipeline)}</div>`:""}
     ${p.rapport?.length?`<div><b>Rapport:</b> ${p.rapport.map(esc).join(" · ")}</div>`:""}</div>`).join("");
  return `<div class="primer"><a class="back" href="#">← Back to HQ</a>
    <div><h1 style="font-size:26px">${esc(m.title)}</h1><div class="muted mono">${esc(fmtT(m.when))}${m.location?" · "+esc(m.location):""}</div>
    ${m.thin_record?`<span class="pill warn" style="margin-top:6px">Thin record</span>`:""} <span class="pill good" style="margin-top:6px">Not from Notion</span></div>
    <section class="panel">${people||'<p class="empty">Nothing recorded.</p>'}</section>
    <section class="panel"><h2>Five questions</h2><ol>${(m.questions||[]).map(q=>`<li>${esc(q)}</li>`).join("")}</ol></section>
    ${m.flags?.length?`<section class="panel"><h2>Flags</h2><ul>${m.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></section>`:""}
    <p class="muted" style="font-size:12px">Sources: ${(m.sources||[]).map(esc).join(" · ")||"none"}</p></div>`;
}

function render(){
  const v=document.getElementById("view"); if(!DATA){v.innerHTML='<p class="empty">Loading the latest status…</p>';return}
  document.getElementById("updated").textContent="Updated "+fmtT(DATA.updated)+" PT";
  const h=location.hash.slice(1);
  v.innerHTML=h.startsWith("m-")?primer(DATA.meetings.find(m=>"m-"+m.id===h)):home(DATA);
  v.querySelectorAll(".agent").forEach(el=>el.addEventListener("click",e=>{
    if(!matchMedia("(max-width:640px)").matches||e.target.closest("a")) return;
    const t=el.querySelector(".tip"); if(t) openPop(el.querySelector(".nm").firstChild.textContent.trim(), t.innerHTML);
  }));
  v.querySelectorAll("[data-iss]").forEach(b=>b.addEventListener("click",()=>issuePop(DATA.issues[+b.dataset.iss])));
  v.querySelectorAll("[data-goal]").forEach(b=>b.addEventListener("click",()=>goalPop(+b.dataset.goal)));
  v.querySelectorAll("[data-proj]").forEach(b=>b.addEventListener("click",()=>projectPop(b.dataset.proj)));
  v.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>b.dataset.title?answer(b,b.dataset.copy,b.dataset.title):copy(b,b.dataset.copy)));
  if(h.startsWith("m-")) window.scrollTo(0,0);
}
/* Suggest an HQ change: a short note becomes a prefilled ops-bus issue "HQ idea: …", which reaches the supervisor. */
function ideaPop(){
  openPop("Suggest an HQ change",`<label for="idea-t" class="muted" style="font-size:13px">What should HQ do better? One line is enough.</label>
    <textarea id="idea-t" maxlength="300" placeholder="e.g. Show which meeting is next at the top"></textarea>
    <div class="act"><button type="button" class="pri" id="idea-go">Open issue on GitHub</button></div>
    <p class="muted" style="margin:0;font-size:12px">Opens a prefilled issue in ops-bus. Tap Submit there and the autopilot picks it up next round.</p>`);
  const ta=document.getElementById("idea-t"); setTimeout(()=>ta.focus(),30);
  document.getElementById("idea-go").addEventListener("click",()=>{
    const txt=ta.value.trim().replace(/\s+/g," "); if(!txt){ta.focus();toast("Write a line first");return}
    const short=txt.length>80?txt.slice(0,77)+"…":txt;
    const u=ISSUE_NEW+"?title="+encodeURIComponent("HQ idea: "+short)+"&body="+encodeURIComponent(txt+"\n\n(from the HQ Suggest button"+(DATA&&DATA.updated?", data "+DATA.updated:"")+")");
    if(openExt(u)){document.getElementById("pop").close();toast("Opened ✓ tap Submit on GitHub")}
    else{try{navigator.clipboard.writeText(u)}catch(_){} toast("Couldn't open GitHub. Copied the issue link")}
  });
}
document.getElementById("idea").addEventListener("click",ideaPop);
addEventListener("hashchange",render);
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{DATA=d;try{render()}catch(e){document.getElementById("view").innerHTML='<p class="empty">HQ hit a display error ('+esc(String(e&&e.message||e))+'). Ask the autopilot chat to fix it.</p>'}}).catch(()=>{document.getElementById("view").innerHTML='<p class="empty">Couldn\'t load status data. Ask the autopilot chat to republish HQ.</p>'});
render();
/* External links: the artifact frame can block plain target=_blank clicks. Open them with window.open;
   if the frame refuses popups, copy the link and say so, so a tap never silently does nothing. */
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";
  t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:8px;font-size:14px;z-index:9;overflow-wrap:anywhere";document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4000)}
document.addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest("a[href]"); if(!a) return;
  const href=a.getAttribute("href"); if(!/^https?:/i.test(href)) return;
  e.preventDefault();
  if(!openExt(href)){ try{window.top.location.href=href;return}catch(_){}
    try{navigator.clipboard.writeText(href).then(()=>toast("Link copied: paste it in a new tab"),()=>toast(href))}catch(_){toast(href)} }
});
</script>
