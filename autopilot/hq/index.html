/* Layout: a cockpit panel. Fuel gauge for the week up top, then "needs you", meetings, crew (workers), burn by project. One column on phones, two on desktop. */
:root{

  --accent:#c77700; --accent-soft:#fff1db; --good:#1f8a4c; --warn:#b26b00; --bad:#c0392b;
  --core:#2b6cb0; --surface:#7b5ea7; --growth:#c77700; --maint:#8795a6; --track:#e3e8ef;
  --f-display:"Barlow Semi Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1320; --panel:#111c2d; --ink:#e7edf5; --ink-2:#9fb0c4; --line:#22324a;
  --accent:#ffb13b; --accent-soft:#2a2112; --good:#4cc283; --warn:#ffb13b; --bad:#ff6b5e;
  --core:#6aa8ff; --surface:#b294e0; --growth:#ffb13b; --maint:#7d8da2; --track:#1c2a40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1320; --panel:#111c2d; --ink:#e7edf5; --ink-2:#9fb0c4; --line:#22324a;
  --accent:#ffb13b; --accent-soft:#2a2112; --good:#4cc283; --warn:#ffb13b; --bad:#ff6b5e;
  --core:#6aa8ff; --surface:#b294e0; --growth:#ffb13b; --maint:#7d8da2; --track:#1c2a40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.wrap>*,#view{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.muted{color:var(--ink-2)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.gauge-top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.stat{display:grid;gap:2px}.stat b{font-family:var(--f-mono);font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}

.chart{width:100%;height:auto;display:block;margin-top:12px}
.bar5{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px}
.bar5>i{display:block;height:100%;background:var(--accent)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-left:4px solid var(--st);border-radius:8px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.tile .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .st{font-size:12px;color:var(--st);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.legend-st{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend-st i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--st)}
.panel{overflow-wrap:anywhere}.cards>*,.rows>*,.row>*{min-width:0}.row .name{overflow:hidden;text-overflow:ellipsis}
.sevbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.agent{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.agent .av{position:relative;width:44px;height:44px}

.agent .nm{font-weight:700;line-height:1.1}

.agent .sx{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sc)}
@media (prefers-reduced-motion:no-preference){.agent[data-s="working"] .av svg{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-2px)}}
/* Phone layout: what needs Nat first, agents as a swipeable strip, chart and cost further down. */
@media (max-width:640px){
  body{font-size:15px}

  .agents::-webkit-scrollbar{display:none}
  .agent{flex:0 0 72%;scroll-snap-align:start}
  .grid{display:flex;flex-direction:column;gap:12px}
  .grid>section[aria-labelledby="n"]{order:-5}
  .grid>section[aria-labelledby="is"]{order:-4}
  .grid>section[aria-labelledby="pb"]{order:-3}
  .grid>section[aria-labelledby="mt"]{order:-2}
  .grid>section[aria-labelledby="g"]{order:-1}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reply{display:flex;flex-wrap:wrap;gap:8px}
  .reply button{min-height:44px;flex:1 1 40%}
  .need a,.iss a{display:inline-block;padding:4px 0}
}

<div class="wrap" id="app">
  <header>
    <h1>Autopilot HQ</h1>
    <span class="muted mono" id="updated">loading…</span>
    <button type="button" class="idea" id="idea" aria-label="Suggest an HQ change" title="Suggest an HQ change"><span aria-hidden="true">+</span><span class="lbl" aria-hidden="true"> Suggest an HQ change</span></button>
  </header>
  <div id="view"></div>
</div>

<script>
const TIER_COLOR={"career-core":"var(--core)","career-surface":"var(--surface)","growth":"var(--growth)","maintenance":"var(--maint)"};
const TIER_LABEL={"career-core":"Career core","career-surface":"Career surface","growth":"Growth & joy","maintenance":"Maintenance"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PT={timeZone:"America/Los_Angeles"};
const fmtT=iso=>new Date(iso).toLocaleString("en-US",{...PT,weekday:"short",hour:"numeric",minute:"2-digit"});
let DATA=null;

const cfgOf=d=>d.pacing&&typeof d.pacing.weekly_target==="number"&&typeof d.pacing.ramp_start_hours_before_reset==="number"?d.pacing:null;
const fpOf=d=>d.fleet_pacing&&d.fleet_pacing.agents?d.fleet_pacing:d.pacing&&d.pacing.agents?d.pacing:null;
function target(hLeft,p){ // mirrors autopilot/pace.py
  if(hLeft<=p.final_sweep_hours) return p.weekly_target;
  const ramp=p.ramp_start_hours_before_reset, slow=p.slow_phase_target;
  if(hLeft>=ramp) return slow*Math.min(Math.max((168-hLeft)/(168-ramp),0),1);
  return slow+(p.weekly_target-slow)*(1-hLeft/ramp);
}

function gaugeChart(d){
  const W=640,H=200,L=34,R=10,T=10,B=26, reset=new Date(d.week.reset).getTime(), start=reset-168*3600e3;
  const x=t=>L+(t-start)/(168*3600e3)*(W-L-R), y=v=>T+(1-v)*(H-T-B);
  let tp=""; for(let h=168;h>=0;h-=2){const t=reset-h*3600e3; tp+=(tp?"L":"M")+x(t).toFixed(1)+","+y(target(h,d.pacing)).toFixed(1);}
  const pts=d.week.timeline.map(p=>[new Date(p.t).getTime(),p.u7]);
  let ap=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join("");
  const last=pts[pts.length-1], now=new Date(d.updated).getTime();
  const area=pts.length?ap+`L${x(last[0]).toFixed(1)},${y(0)}L${x(pts[0][0]).toFixed(1)},${y(0)}Z`:"";
  const days=["Sat","Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let grid=""; for(let i=0;i<=7;i++){const gx=x(start+i*86400e3); grid+=`<line x1="${gx}" x2="${gx}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/><text x="${gx}" y="${H-8}" text-anchor="middle">${days[i]}</text>`;}
  for(const v of [0,.25,.5,.75,1]) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v?2:0} 3"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v*100}%</text>`;
  const fast=x(reset-d.pacing.ramp_start_hours_before_reset*3600e3);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly usage against the pacing target">
  ${grid}<rect x="${fast}" y="${T}" width="${W-R-fast}" height="${H-T-B}" fill="var(--accent)" opacity=".06"/>
  <text x="${fast+4}" y="${T+11}">fast phase</text>
  <path d="${tp}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4"/>
  ${area?`<path d="${area}" fill="var(--core)" opacity=".15"/>`:""}
  <path d="${ap}" fill="none" stroke="var(--core)" stroke-width="2.5"/>
  ${last?`<circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="var(--core)"/>`:""}
  <line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H-B}" stroke="var(--accent)" stroke-width="1.5"/>
  </svg>
  <div class="legend"><span><i class="dot" style="background:var(--core)"></i>Used</span><span><i class="dot" style="background:var(--ink-2)"></i>Target (dashed)</span><span><i class="dot" style="background:var(--accent)"></i>Now</span></div>`;
}

function proChart(d){ // Pro account: cumulative new tokens over the same Sat-Sat week as the gauge above (plan % isn't visible for Pro)
  const tl=d.cost&&d.cost.pro&&d.cost.pro.timeline; if(!tl||!tl.length) return "";
  const W=640,H=130,L=34,R=10,T=10,B=22, reset=new Date(d.week.reset).getTime(), start=reset-168*3600e3, x=t=>L+(t-start)/(168*3600e3)*(W-L-R);
  let cum=0,cr=0; const pts=[[start,0]]; tl.forEach(b=>{const t=new Date(b.t).getTime(); if(t<start||t>reset) return; pts.push([t,cum]); cum+=b.new; cr+=b.cache_read; pts.push([t,cum])});
  if(pts.length<2) return "";
  const now=Math.min(new Date(d.updated).getTime(),reset); pts.push([now,cum]);
  const max=Math.max(cum,1), y=v=>T+(1-v/max)*(H-T-B), tok=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(n);
  const days=["Sat","Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; let grid="";
  for(let i=0;i<=7;i++){const gx=x(start+i*86400e3); grid+=`<line x1="${gx}" x2="${gx}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><text x="${gx}" y="${H-6}" text-anchor="middle">${days[i]}</text>`}
  for(const f of [0,.5,1]) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-dasharray="${f?2:0} 3"/><text x="${L-6}" y="${y(max*f)+3}" text-anchor="end">${tok(max*f)}</text>`;
  const line=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join(""), last=pts[pts.length-1];
  return `<h2 style="margin-top:16px">Pro account · tokens this week</h2>
  <svg class="chart" style="margin-top:4px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pro account cumulative new tokens this week">${grid}
  <path d="${line}L${x(last[0]).toFixed(1)},${y(0)}L${x(start)},${y(0)}Z" fill="var(--accent)" opacity=".15"/>
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="var(--accent)"/></svg>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>New tokens (input + output + cache write): ${tok(cum)}</span><span>Cache re-reads ${tok(cr)} not counted</span></div>
  <div class="muted" style="font-size:13px">Pro plan % isn't visible from the Pro runner, so this is token volume, not share of the weekly limit.</div>`;
}

const ST_COLOR={"needs you":"var(--bad)","running":"var(--good)","queued":"var(--core)","paused":"var(--warn)","idle":"var(--maint)","off":"var(--line)"};
function ago(iso){const t=new Date(iso);if(!iso||isNaN(t))return "";const m=Math.max(0,(Date.now()-t)/60000);
  return m<60?Math.round(m)+"m ago":m<48*60?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"}
function boardHtml(b){
  if(!b||!b.length) return '<div class="empty">No projects.</div>';
  const counts={}; b.forEach(p=>counts[p.status]=(counts[p.status]||0)+1);
  const dormant=p=>/^(idle|off)$/.test(p.status)&&!p.running&&!p.queued&&!p.codex&&!p.needs&&!p.next_step;
  const live=b.filter(p=>!dormant(p)), sleep=b.filter(dormant);
  const tile=p=>{
    const bits=[]; if(p.running) bits.push(p.running+" running"); if(p.queued) bits.push(p.queued+" queued");
    if(p.codex) bits.push(p.codex+" Codex"); if(p.needs) bits.push(p.needs+" for you"); if(!bits.length&&p.done) bits.push(p.done+" done this week");
    return `<button type="button" class="tile" data-proj="${esc(p.project)}" style="--st:${ST_COLOR[p.status]}" aria-label="${esc(p.project)}: ${esc(p.status)}. Show details"><span class="nm">${esc(p.project)}</span><span class="st">${esc(p.status)}</span><span class="ct">${esc(bits.join(" · ")||"—")}${p.last_activity&&ago(p.last_activity)?` · <span title="${esc(p.last_activity)}">pushed ${esc(ago(p.last_activity))}</span>`:""}</span>${p.next_step?`<span class="nx">Next: ${esc(p.next_step)}</span>`:""}</button>`};
  const tiles=live.map(tile).join("")+(sleep.length?`</div><details class="closed dorm"><summary class="muted">${sleep.length} dormant: ${esc(sleep.map(p=>p.project).join(", "))}</summary><div class="board">${sleep.map(tile).join("")}</div></details><div>`:"");
  const legend=Object.keys(ST_COLOR).filter(k=>counts[k]).map(k=>`<span style="--st:${ST_COLOR[k]}"><i></i>${counts[k]} ${esc(k)}</span>`).join("");
  return `<div class="board">${tiles}</div><div class="legend-st">${legend}</div>`;
}
const SEV_COLOR={critical:"var(--bad)",high:"var(--warn)",medium:"var(--core)",low:"var(--maint)"};
function issuesHtml(list){
  if(!list||!list.length) return '<div class="empty">No open issues.</div>';
  const c={}; list.forEach(i=>c[i.severity]=(c[i.severity]||0)+1);
  // 8. zero counts are neutral, not alarm-coloured
  const bar=Object.keys(SEV_COLOR).map(k=>`<span class="sev${c[k]?"":" zero"}" style="--sv:${c[k]?SEV_COLOR[k]:"var(--line)"}">${c[k]||0} ${k}</span>`).join("");
  const rows=list.map((i,k)=>`<button type="button" class="iss" data-iss="${k}" style="--sv:${SEV_COLOR[i.severity]||"var(--maint)"}"><span class="dot" aria-hidden="true"></span><span class="t">${esc(i.title)}</span><span class="chev" aria-hidden="true">›</span></button>`).join("");
  return `<div class="sevbar">${bar}</div>${rows}`;
}
/* Cartoon avatars: round face in each agent's colour plus one prop that says what they do. */
const AGENT_LOOK={
  pinny:{c:"#7c5cff",prop:'<circle cx="35" cy="33" r="6" fill="none" stroke="#2a2340" stroke-width="2.5"/><path d="M39.5 37.5l4 4" stroke="#2a2340" stroke-width="3" stroke-linecap="round"/>'},
  sinny:{c:"#e8743b",prop:'<rect x="27" y="30" width="16" height="10" rx="2" fill="#2a2340"/><path d="M31 33l-2 2 2 2M39 33l2 2-2 2" stroke="#ffd9c2" stroke-width="1.5" fill="none" stroke-linecap="round"/>'},
  cinny:{c:"#10a37f",prop:'<circle cx="36" cy="35" r="5" fill="none" stroke="#1d3b33" stroke-width="3" stroke-dasharray="3 2"/><circle cx="36" cy="35" r="1.8" fill="#1d3b33"/>'},
  binny:{c:"#2b8be6",prop:'<rect x="29" y="27" width="13" height="16" rx="2" fill="#fff" stroke="#173a5e" stroke-width="2"/><path d="M32 32h7M32 35.5h7M32 39h5" stroke="#173a5e" stroke-width="1.6" stroke-linecap="round"/>'},
  minny:{c:"#e64f8f",prop:'<path d="M28 31h15l-1.5 12h-12z" fill="#fff" stroke="#5e1736" stroke-width="2" stroke-linejoin="round"/><path d="M32 31c0-4 7-4 7 0" fill="none" stroke="#5e1736" stroke-width="2"/>'},
};
function avatar(key){const L=AGENT_LOOK[key]||{c:"#8795a6",prop:""};
  return `<svg viewBox="0 0 46 46" aria-hidden="true"><circle cx="20" cy="22" r="17" fill="${L.c}"/>
  <ellipse cx="14" cy="9" rx="4" ry="5" fill="${L.c}"/><ellipse cx="26" cy="9" rx="4" ry="5" fill="${L.c}"/>
  <circle cx="14" cy="20" r="3.2" fill="#fff"/><circle cx="25" cy="20" r="3.2" fill="#fff"/>
  <circle cx="14.8" cy="20.6" r="1.6" fill="#1b1b2a"/><circle cx="25.8" cy="20.6" r="1.6" fill="#1b1b2a"/>
  <path d="M15 27q4.5 4 9 0" stroke="#1b1b2a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="10.5" cy="26" r="2" fill="#fff" opacity=".35"/><circle cx="29" cy="26" r="2" fill="#fff" opacity=".35"/>${L.prop}</svg>`}
const AGENT_STATUS={working:"var(--good)",queued:"var(--core)",blocked:"var(--bad)",idle:"var(--maint)",offline:"var(--line)"};
/* Agent card: avatar inside a utilization ring (share of that agent's plan used this week).
   Hover, focus or tap shows a small bubble with the usage trend. No feed = dashed grey ring. */
AGENT_LOOK.chinny=AGENT_LOOK.cinny;
function ringTick(tg){if(typeof tg!=="number"||!isFinite(tg))return "";const a=(Math.max(0,Math.min(1,tg))*360-90)*Math.PI/180;
  return `<line x1="${(24+17*Math.cos(a)).toFixed(1)}" y1="${(24+17*Math.sin(a)).toFixed(1)}" x2="${(24+25*Math.cos(a)).toFixed(1)}" y2="${(24+25*Math.sin(a)).toFixed(1)}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>`}

    <circle cx="24" cy="24" r="${r}" fill="none" stroke="${hot}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(v*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 24 24)"/>${ringTick(tg)}</svg>`;

function spark(series,col){

    <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="2.5" fill="${col}"/>${tick}
    <text x="${L}" y="${H-3}" font-size="8" fill="var(--ink-2)">${lab(x0)}</text><text x="${W-Rt}" y="${H-3}" font-size="8" text-anchor="end" fill="var(--ink-2)">${R?(assumed?"reset ~"+esc(fmtT(new Date(x1).toISOString()))+" PT":"reset "+lab(x1)):"now"}</text></svg>`}

function costHtml(c,upd){

async function answer(btn,text,title){
  const sid=DATA&&DATA.supervisor, pick=text.split(" → ").slice(1).join(" → "), t="HQ answer: "+title+" → "+pick;
  const gh=()=>{const u=ISSUE_NEW+"?title="+encodeURIComponent(t)+"&body="+encodeURIComponent("Tap Submit to send this to the autopilot supervisor.");
    if(!openExt(u)){copy(btn,text);toast("Couldn't open GitHub. Copied your answer instead")} else {btn.textContent="Opened ✓ tap Submit"}};
  if(btn.dataset.fallback){gh();return}
  if(ONE){
    const orig=btn.textContent, card=btn.closest(".need"); btn.disabled=true; btn.textContent="Sending…";
    try{const j=await fileIssue(t,"Answer from HQ: "+pick);
      btn.textContent="Sent ✓"; if(card){card.style.opacity=".55";card.querySelectorAll("button.code").forEach(b=>b.disabled=true)}
      toast("Sent to the autopilot"+(j&&j.number?" (#"+j.number+")":""));
    }catch(e){btn.disabled=false; btn.textContent="Finish on GitHub ↗"; btn.dataset.fallback="1"; toast("One-click send failed. Tap again to finish on GitHub")}
    return}
  let mcp=null; try{mcp=await window.claude?.use?.("mcp")}catch(e){}
  if(!sid||!mcp){
    /* No Claude connector here (e.g. hq.natwong.dev): open a prefilled GitHub issue; submitting it wakes the supervisor. */
    const t="HQ answer: "+title+" → "+text.split(" → ").slice(1).join(" → ");
    const u=ISSUE_NEW+"?title="+encodeURIComponent(t)+"&body="+encodeURIComponent("Tap Submit to send this to the autopilot supervisor.");
    if(!openExt(u)){copy(btn,text);toast("Couldn't open GitHub. Copied your answer instead")} else {btn.textContent="Opened ✓ tap Submit"}
    return}
  const orig=btn.textContent; btn.disabled=true; btn.textContent="Sending…";
  try{
    await mcp.callTool(CCR,"send_message",{session_id:sid,message:"HQ answer from Nat: "+title+" → "+text.split(" → ").slice(1).join(" → ")});
    btn.textContent="Sent ✓"; const c=btn.closest(".need"); if(c) c.style.opacity=".55";
  }catch(e){btn.disabled=false; btn.textContent=orig; copy(btn,text)}
}

  const t=new Date(d&&d.updated); if(isNaN(t)) return "";
  const min=Math.round((Date.now()-t)/60000); if(min<=30) return "";
  const age=min<120?min+" min":Math.round(min/60)+" h";
  return `<div class="stalebar${min>180?" bad":""}" role="status"><b>Data is ${age} old.</b><span>The numbers below may be out of date; the feed normally updates every 15 min.</span></div>`;
}
function render(){
  const v=document.getElementById("view"); if(!DATA){v.innerHTML='<p class="empty">Loading the latest status…</p>';return}
  document.getElementById("updated").textContent="Updated "+(matchMedia("(max-width:640px)").matches&&ptDay(DATA.updated)===ptDay(Date.now())?new Date(DATA.updated).toLocaleTimeString("en-US",{...PT,hour:"numeric",minute:"2-digit"}):fmtT(DATA.updated)+" PT");
  const h=location.hash.slice(1);
  v.innerHTML=staleHtml(DATA)+(h.startsWith("m-")?primer((DATA.meetings||[]).find(m=>"m-"+m.id===(()=>{try{return decodeURIComponent(h)}catch(_){return h}})())):home(DATA));
  v.querySelectorAll(".agent").forEach(el=>el.addEventListener("click",e=>{
    if(!matchMedia("(max-width:640px)").matches||e.target.closest("a")) return;
    const t=el.querySelector(".tip"); if(t) openPop(el.querySelector(".nm").firstChild.textContent.trim(), t.innerHTML);
  }));
  v.querySelectorAll("[data-iss]").forEach(b=>b.addEventListener("click",()=>issuePop(DATA.issues[+b.dataset.iss])));
  v.querySelectorAll("[data-goneeds]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();
    const go=()=>{const n=document.getElementById("n");if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})};
    if(curTab()!=="life"){location.hash="life";setTimeout(go,30)}else go()}));
  v.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{const go=()=>{const e=document.getElementById(b.dataset.go);if(e)e.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})};
    if(b.dataset.tab&&curTab()!==b.dataset.tab){location.hash=b.dataset.tab;setTimeout(go,60)}else go()}));
  v.querySelectorAll("[data-decall]").forEach(b=>b.addEventListener("click",decAllPop));
  v.querySelectorAll("[data-reverse]").forEach(b=>b.addEventListener("click",()=>reversePop(+b.dataset.reverse)));
  v.querySelectorAll("[data-decok]").forEach(b=>b.addEventListener("click",()=>{SEEN_BEFORE=new Date().toISOString();try{localStorage.setItem("hq.lastVisit",SEEN_BEFORE)}catch(_){} render()}));
  v.querySelectorAll("[data-rf]").forEach(b=>b.addEventListener("click",()=>{RFILT=b.dataset.rf||null;try{RFILT?localStorage.setItem("hq.rfilt",RFILT):localStorage.removeItem("hq.rfilt")}catch(_){} const y=scrollY;render();scrollTo(0,y)}));
  const rq=v.querySelector("#rq"); if(rq) rq.addEventListener("input",()=>{const q=rq.value.trim().toLowerCase(), l=document.getElementById("rlist"); if(!l) return;
    l.classList.toggle("all",!!q); const mb=v.querySelector("[data-rmore]"); if(mb) mb.style.display=q?"none":"";
    let n=0; l.querySelectorAll("li").forEach(li=>{const hit=!q||li.dataset.t.includes(q); li.style.display=hit?"":"none"; if(hit)n++});
    let e=document.getElementById("rq-n"); if(!e){e=document.createElement("p");e.id="rq-n";e.className="muted";e.style.cssText="margin:6px 0 0;font-size:12px";l.after(e)} e.textContent=q?`${n} match${n===1?"":"es"}`:""});
  v.querySelectorAll("[data-rmore]").forEach(b=>b.addEventListener("click",()=>{const l=document.getElementById("rlist");if(l)l.classList.add("all");b.remove()}));
  v.querySelectorAll("[data-overdue]").forEach(b=>b.addEventListener("click",overduePop));
  v.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>{const l=document.getElementById("wkl");if(l)l.classList.add("all");b.remove()}));
  v.querySelectorAll("[data-goal]").forEach(b=>b.addEventListener("click",()=>goalPop(+b.dataset.goal)));
  v.querySelectorAll("[data-proj]").forEach(b=>b.addEventListener("click",()=>projectPop(b.dataset.proj)));
  v.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>b.dataset.title?answer(b,b.dataset.copy,b.dataset.title):copy(b,b.dataset.copy)));
  if(h.startsWith("m-")) window.scrollTo(0,0);
  if(KF>=0) kMark(false);
}
function overduePop(){const it=((((DATA.goals||{}).progress||{}).tasks||{}).overdue_items||[]).filter(x=>x&&x.title);
  const ago=x=>{if(!isDate(x.due))return "";const n=Math.round((new Date(ptDay(Date.now())+"T12:00:00-08:00")-new Date(asDay(x.due)))/dayMs);return n>0?`${n} day${n===1?"":"s"} late`:"due today"};
  openPop("Overdue tasks",`<ul class="lst">${it.map(x=>`<li>${/^https:\/\//.test(x.url||"")?link(x.url,x.title):esc(x.title)}${x.due?` <span class="muted">· ${esc(ago(x))}</span>`:""}</li>`).join("")}</ul>
    <p class="muted" style="margin:0;font-size:12px">From Notion. Open one to finish or reschedule it there.</p>`)}
/* Keyboard (desktop / fine pointer): j/k pick a need, 1-9 focus its answer (Enter sends), g l / g f tabs, ? help. */
let KF=-1, gAt=0;
const kOn=()=>matchMedia("(pointer:fine)").matches||innerWidth>=860;
function kNeeds(){return [...document.querySelectorAll("#view .card.need")]}
function kMark(scroll){const c=kNeeds(); if(KF>=c.length) KF=c.length-1;
  c.forEach((x,i)=>x.classList.toggle("kf",i===KF));
  if(scroll&&c[KF]){c[KF].setAttribute("tabindex","-1");c[KF].focus({preventScroll:true});c[KF].scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}}
function keysPop(){openPop("Keyboard shortcuts",`<dl class="keys">
  <dt><kbd>j</kbd> <kbd>k</kbd></dt><dd>Next / previous need</dd>
  <dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd>Pick that answer on the selected need (the first one if none); <kbd>Enter</kbd> sends it</dd>
  <dt><kbd>g</kbd> <kbd>l</kbd></dt><dd>Life tab</dd><dt><kbd>g</kbd> <kbd>f</kbd></dt><dd>Fleet tab</dd>
  <dt><kbd>r</kbd></dt><dd>Refresh data</dd><dt><kbd>?</kbd></dt><dd>This help</dd><dt><kbd>Esc</kbd></dt><dd>Close a popup</dd></dl>`)}
addEventListener("keydown",e=>{
  if(!kOn()||e.metaKey||e.ctrlKey||e.altKey||e.isComposing) return;
  const t=e.target; if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if(document.querySelector("dialog[open]")) return;
  const k=e.key, now=Date.now();
  if(gAt&&now-gAt<1200&&(k==="l"||k==="f")){gAt=0;e.preventDefault();location.hash=k==="l"?"life":"fleet";return}
  gAt=0;
  if(k==="g"){gAt=now;return}
  if(k==="?"){e.preventDefault();keysPop();return}
  if(k==="r"){e.preventDefault();load();toast("Refreshing…");return}
  const c=kNeeds(); if(!c.length) return;
  if(k==="j"||k==="k"){e.preventDefault();KF=KF<0?0:Math.max(0,Math.min(c.length-1,KF+(k==="j"?1:-1)));kMark(true);return}
  if(/^[1-9]$/.test(k)){const card=c[KF<0?0:KF], b=[...card.querySelectorAll("button.code[data-title]:not(:disabled)")][+k-1];
    if(!b) return; e.preventDefault(); if(KF<0){KF=0;kMark(false)} b.focus(); toast("“"+b.textContent.trim()+"” selected · Enter sends")}
});
/* Suggest an HQ change: a short note becomes a prefilled ops-bus issue "HQ idea: …", which reaches the supervisor. */
function ideaPop(){
  openPop("Suggest an HQ change",`<label for="idea-t" class="muted" style="font-size:13px">What should HQ do better? One line is enough.</label>
    <textarea id="idea-t" maxlength="300" placeholder="e.g. Show which meeting is next at the top"></textarea>
    <div class="act"><button type="button" class="pri" id="idea-go">${ONE?"Send idea":"Open issue on GitHub"}</button></div>
    <p class="muted" style="margin:0;font-size:12px">${ONE?"Files it in ops-bus with one tap; the autopilot picks it up next round.":"Opens a prefilled issue in ops-bus. Tap Submit there and the autopilot picks it up next round."}</p>`);
  const ta=document.getElementById("idea-t"); setTimeout(()=>ta.focus(),30);
  document.getElementById("idea-go").addEventListener("click",()=>{
    const txt=ta.value.trim().replace(/\s+/g," "); if(!txt){ta.focus();toast("Write a line first");return}
    const short=txt.length>80?txt.slice(0,77)+"…":txt;
    const u=ISSUE_NEW+"?title="+encodeURIComponent("HQ idea: "+short)+"&body="+encodeURIComponent(txt+"\n\n(from the HQ Suggest button"+(DATA&&DATA.updated?", data "+DATA.updated:"")+")");
    const go=document.getElementById("idea-go"), body=txt+"\n\n(from the HQ Suggest button"+(DATA&&DATA.updated?", data "+DATA.updated:"")+")";
    if(ONE&&!go.dataset.fallback){go.disabled=true;go.textContent="Sending…";
      fileIssue("HQ idea: "+short,body).then(j=>{document.getElementById("pop").close();toast("Idea sent ✓"+(j&&j.number?" (#"+j.number+")":""))})
        .catch(()=>{go.disabled=false;go.dataset.fallback="1";go.textContent="Finish on GitHub ↗";toast("One-click send failed. Tap again to finish on GitHub")});return}
    if(openExt(u)){document.getElementById("pop").close();toast("Opened ✓ tap Submit on GitHub")}
    else{try{navigator.clipboard.writeText(u)}catch(_){} toast("Couldn't open GitHub. Copied the issue link")}
  });
}
document.getElementById("idea").addEventListener("click",ideaPop);
let RET=null, LASTH=location.hash.slice(1);
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="#m-"]');if(a)RET=window.scrollY},true);
addEventListener("hashchange",()=>{const h=location.hash.slice(1), from=LASTH; LASTH=h; render();
  if((h==="life"||h==="")&&from.startsWith("m-")&&RET!=null){const y=RET;RET=null;requestAnimationFrame(()=>window.scrollTo(0,y))}
  else if(h==="life"||h==="fleet")window.scrollTo(0,0)});
/* Anything in the data that waits on Nat becomes a Need, wherever it was filed: fleet issues owned by Nat,
   and items flagged needs_nat (e.g. a PR to merge, a secret to add). They carry a link, never answer buttons. */
function ghMirror(d){const G=d&&d.gh_issues; if(!G||!Array.isArray(G.items)) return d;
  const SEV=["critical","high","medium","low"], ago=t=>t&&!isNaN(new Date(t))?fmtD(t).replace(/^\w+, /,""):"";
  const map=i=>({severity:SEV.includes(i.severity)?i.severity:"medium",area:i.area||(i.queue?"chinny":i.repo),title:i.title,
    detail:[`${i.repo} #${i.number}`,i.queue?i.queue.replace("codex:","Chinny ")+"":"",i.state==="closed"&&i.closed?"closed "+ago(i.closed):"opened "+ago(i.since)].filter(Boolean).join(" · "),
    url:/^https:\/\/github\.com\//.test(i.url||"")?i.url:"",owner:/^zuzivian$/i.test(i.owner||"")?"Nat":i.owner,since:ago(i.since),closed:i.closed,gh:1,queue:i.queue});
  const open=G.items.filter(i=>i.state==="open"&&!i.queue), shut=G.items.filter(i=>i.state==="closed");
  d.chinny_queue=G.items.filter(i=>i.state==="open"&&i.queue).map(map);
  d.issues_sup=d.issues||[]; d.issues=open.map(map).sort((a,b)=>SEV.indexOf(a.severity)-SEV.indexOf(b.severity));
  d.issues_closed=shut.map(map).sort((a,b)=>String(b.closed).localeCompare(String(a.closed))); d.issues_at=G.at; return d}
function natNeeds(d){if(!d||!Array.isArray(d.needs)) return d; const seen=new Set(d.needs.map(n=>String(n.title||"").toLowerCase()));
  const own=x=>/^(nat\b|zuzivian$)/i.test(String(x&&x.owner||""))||x&&(x.needs_nat===true||/^nat$/i.test(String(x.needs||"")));
  // one card per thing: an action row wins over the fleet issue that tracks the same thing
  // (linked by x.issue, or sharing a distinctive ref: an ALL_CAPS name, "PR #N", or a file name like X.md)
  const refs=t=>new Set((String(t||"").match(/\b[A-Z][A-Z0-9]*_[A-Z0-9_]+\b|PR #\d+|\b[\w-]+\.(?:md|json|yml|py|js)\b/g)||[]).map(x=>x.toLowerCase()));
  const acts=(d.nat_actions||[]).filter(x=>x&&x.title).map(x=>({project:x.project||"fleet",title:x.title,detail:x.detail||"",url:x.url,issue:x.issue,options:x.options||[],from:"Your action"}));
  const dup=i=>acts.some(a=>(a.issue&&a.issue===i.url)||[...refs(i.title+" "+(i.detail||""))].some(r=>refs(a.title+" "+a.detail+" "+(a.url||"")).has(r)));
  const iss=(d.issues||[]).filter(own).filter(i=>!dup(i)).map(i=>({project:"fleet",title:i.title,detail:i.detail||"",url:i.url,options:[],from:"Fleet issue"}));
  const FP=fpOf(d), stall=[];
  for(const a of d.agents||[]){const P=paceOf(FP,a); if(P&&P.stalled&&P.idle!=null&&P.idle>120)
    stall.push({project:"fleet",title:`${a.name||a.key} hasn't run for ${idleTxt(P.idle)}; check its schedule`,detail:`${P.waiting!=null?P.waiting+" tasks waiting. ":""}It only wakes on its own app schedule${P.lastRun?`; last ran ${fmtT(P.lastRun)} PT`:""}.`,options:[],from:"Fleet"})}
  const add=acts.concat(iss,stall).filter(n=>!seen.has(String(n.title||"").toLowerCase()));
  d.needs=d.needs.concat(add); return d}
function load(){return fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{DATA=natNeeds(ghMirror(d));try{render()}catch(e){document.getElementById("view").innerHTML='<p class="empty">HQ hit a display error ('+esc(String(e&&e.message||e))+'). Ask the autopilot chat to fix it.</p>'}}).catch(()=>{if(DATA){try{render()}catch(_){}}else document.getElementById("view").innerHTML='<p class="empty">Couldn\'t load status data. Ask the autopilot chat to republish HQ.</p>'})}
load().then(()=>{if(DATA&&typeof DATA.one_click==="boolean"){ONE=DATA.one_click;if(ONE)try{render()}catch(_){}}else probeOne()});
/* Refresh every 5 min while the tab is visible (not while a popup is open), and on return to the tab. */
setInterval(()=>{const pop=document.getElementById("pop");if(document.visibilityState==="visible"&&!(pop&&pop.open))load()},5*60e3);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&DATA&&Date.now()-new Date(DATA.updated)>5*60e3)load()});
render();
/* External links: the artifact frame can block plain target=_blank clicks. Open them with window.open;
   if the frame refuses popups, copy the link and say so, so a tap never silently does nothing. */
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";
  t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:8px;font-size:14px;z-index:9;overflow-wrap:anywhere";document.body.appendChild(t)}
  t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4000)}
document.addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest("a[href]"); if(!a) return;
  const href=a.getAttribute("href"); if(!/^https?:/i.test(href)) return;
  e.preventDefault();
  if(!openExt(href)){ try{window.top.location.href=href;return}catch(_){}
    try{navigator.clipboard.writeText(href).then(()=>toast("Link copied: paste it in a new tab"),()=>toast(href))}catch(_){toast(href)} }
});
</script>
