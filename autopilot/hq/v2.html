<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<meta name="robots" content="noindex">
<title>HQ</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0b0d12;--bg2:#11141b;--card:#161a23;--card2:#1c2130;--line:#262c3b;--ink:#eef1f7;--ink-2:#a7afc2;--ink-3:#7d869b;
  --acc:#8b7bff;--acc2:#5ec8ff;--good:#3ddc97;--warn:#ffb547;--bad:#ff6b6b;--r:20px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,rgba(139,123,255,.18),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(94,200,255,.10),transparent 60%),var(--bg)}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(32px + var(--safe))}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.dim{color:var(--ink-3)}
/* header */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.hello h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-weight:750}
.hello .sub{margin-top:6px;font-size:15px;color:var(--ink-2)}
.hello .when{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
/* broken banner */
.alarm{display:flex;gap:10px;align-items:flex-start;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.45);color:#ffd0d0;
  border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:14px}
.alarm b{color:#fff}.alarm .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);margin-top:5px;flex:none;box-shadow:0 0 0 4px rgba(255,107,107,.18);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,107,107,0)}}
/* NOW card */
.now{position:relative;overflow:hidden;border-radius:var(--r);padding:20px 18px 18px;margin-bottom:14px;
  background:linear-gradient(160deg,#2a2160 0%,#1a1d3a 45%,#141824 100%);border:1px solid rgba(139,123,255,.35);box-shadow:0 20px 50px -20px rgba(80,60,200,.55)}
.now.meet{background:linear-gradient(160deg,#0f3a4f 0%,#13263a 50%,#141824 100%);border-color:rgba(94,200,255,.4);box-shadow:0 20px 50px -20px rgba(30,140,200,.5)}
.now.eve{background:linear-gradient(160deg,#3a2140 0%,#221a33 50%,#141824 100%);border-color:rgba(255,140,200,.3)}
.now.zero{background:linear-gradient(160deg,#103a2c 0%,#152a26 50%,#141824 100%);border-color:rgba(61,220,151,.4)}
.now .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.now h2{margin:8px 0 6px;font-size:24px;line-height:1.2;letter-spacing:-.01em;font-weight:720}
.now p{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:15px}
.now .big{font-size:44px;font-weight:780;letter-spacing:-.03em;line-height:1}
.now .row2{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.now .row2>div{min-width:84px}.now .row2 .n{font-size:22px;font-weight:720}.now .row2 .l{font-size:12px;color:rgba(255,255,255,.65)}
.now ul{margin:10px 0 0;padding-left:18px}.now li{margin:4px 0}
.now .cta{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:650;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  padding:10px 14px;border-radius:12px;min-height:44px}
.now .glow{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
/* chips strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 9px;min-width:0;text-align:left;cursor:pointer;min-height:64px}
.chip .v{font-size:20px;font-weight:740;letter-spacing:-.01em;white-space:nowrap}.chip .l{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.25}
.chip.good .v{color:var(--good)}.chip.warn .v{color:var(--warn)}.chip.bad .v{color:var(--bad)}
/* sections */
h3.sec{display:flex;align-items:baseline;gap:8px;margin:22px 2px 10px;font-size:13px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
h3.sec .c{font-size:13px;letter-spacing:0;color:var(--ink-3);font-weight:600;text-transform:none}
/* needs queue */
.q{display:grid;gap:10px}
.need{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;transition:transform .35s ease,opacity .35s ease,max-height .45s ease,margin .45s ease,padding .45s ease;max-height:800px;overflow:hidden}
.need.hot{border-color:rgba(255,181,71,.45)}.need.over{border-color:rgba(255,107,107,.5)}
.need .t{font-weight:680;font-size:16px;line-height:1.3}
.need .m{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.need .m .due{font-weight:650}.need.hot .due{color:var(--warn)}.need.over .due{color:var(--bad)}
.need .d{margin-top:8px;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.need .d.open{-webkit-line-clamp:unset;display:block}
.need .more{background:none;border:0;padding:4px 0;color:var(--acc2);font-size:13px;cursor:pointer;min-height:32px}
.ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ans button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:620;font-size:14.5px}
.ans button.rec{background:linear-gradient(180deg,#7c6bff,#6a58f5);border-color:transparent;color:#fff}
.ans button:disabled{opacity:.6}
.ans a.open{display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:620;font-size:14.5px;color:var(--ink)}
.need.done{transform:translateX(30px);opacity:0;max-height:0;margin:-10px 0 0;padding-top:0;padding-bottom:0;border-width:0}
.checkpop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:50;
  width:96px;height:96px;border-radius:50%;background:var(--good);display:grid;place-items:center;box-shadow:0 20px 60px rgba(61,220,151,.45);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.checkpop.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.checkpop svg{width:52px;height:52px}.checkpop path{stroke-dasharray:60;stroke-dashoffset:60}.checkpop.on path{transition:stroke-dashoffset .45s .1s ease;stroke-dashoffset:0}
.zeroq{text-align:center;padding:26px 16px;background:var(--card);border:1px dashed rgba(61,220,151,.45);border-radius:18px;color:var(--ink-2)}
.zeroq .e{font-size:34px}.zeroq b{display:block;color:var(--ink);font-size:17px;margin:6px 0 2px}
.later{margin-top:10px}.later summary{cursor:pointer;color:var(--ink-2);font-size:14px;min-height:44px;display:flex;align-items:center}
.later ul{list-style:none;margin:0;padding:0}.later li{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}
.later li span:last-child{color:var(--ink-3);white-space:nowrap;font-size:12.5px}
/* goals */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.goal.wide{grid-column:1/-1}
.goal .gk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.goal .gv{font-size:26px;font-weight:760;margin-top:6px;letter-spacing:-.02em}.goal .gv small{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.goal .gs{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.ring{width:64px;height:64px;float:right;margin:-2px -2px 0 6px}
.bar{height:8px;border-radius:5px;background:#232838;overflow:hidden;margin-top:10px;position:relative}.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:46px;margin-top:10px}
.days span{display:flex;flex-direction:column;justify-content:flex-end;height:100%;font-size:10px;color:var(--ink-3);text-align:center;gap:3px}
.days i{display:block;border-radius:4px 4px 2px 2px;min-height:3px}
.funnel{display:flex;gap:6px;margin-top:10px}
.funnel div{flex:1;background:var(--card2);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.funnel b{display:block;font-size:20px}.funnel span{font-size:11px;color:var(--ink-2)}
/* footer */
.fleet{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);min-height:56px}
.fleet .s{font-size:13px;color:var(--ink-2)}
.foot{margin-top:16px;text-align:center;font-size:12px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe));transform:translateX(-50%) translateY(20px);opacity:0;background:#262c3b;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.err{padding:40px 16px;text-align:center;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="err">Loading…</p></main>
<div class="checkpop" id="pop" aria-hidden="true"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-18" fill="none" stroke="#06261a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* HQ v2: one "Now" card chosen by time and context, one Needs queue, three goal visuals. Fleet internals live on the classic page.
   Data: /api/data (deployed) or data.json (static). Answers: /api/answer, else a prefilled GitHub issue. No names in source. */
const PT={timeZone:"America/Los_Angeles"};
const Q=new URLSearchParams(location.search);
const NOW=()=>{const a=Q.get("at"); const t=a?new Date(a):null; return t&&!isNaN(t)?t:new Date()}; // ?at=2026-11-25T08:00-08:00 simulates a time
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>typeof v==="number"&&isFinite(v)?v:null;
const isDate=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v)&&!isNaN(new Date(v));
const asDay=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)?v+"T12:00:00-08:00":v;
const ptDay=t=>new Date(t).toLocaleDateString("en-CA",PT);
const ptHour=t=>+new Date(t).toLocaleString("en-US",{...PT,hour:"numeric",hour12:false})%24;
const ptDow=t=>new Date(t).toLocaleDateString("en-US",{...PT,weekday:"short"});
const tm=t=>new Date(t).toLocaleTimeString("en-US",{...PT,hour:"numeric",minute:"2-digit"});
const dayLbl=t=>new Date(t).toLocaleDateString("en-US",{...PT,weekday:"short",month:"short",day:"numeric"});
const minsUntil=t=>Math.round((new Date(t)-NOW())/6e4);
const OPS=/^https:\/\/github\.com\/zuzivian\/ops-bus\/(?:blob|tree)\/main\/([^?#]*)(#.*)?$/;
const link=u=>{u=String(u||""); const m=u.match(OPS); if(m){let p=m[1];try{p=decodeURIComponent(p)}catch(_){} return "/api/file?path="+encodeURIComponent(p.replace(/\/+$/,""))+(m[2]||"")} return /^https:\/\//.test(u)?u:""};
const ISSUE_NEW="https://github.com/zuzivian/ops-bus/issues/new";
let D=null, ONE=null, SRC=null;

/* ---------- data ---------- */
const getJSON=u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok||!/json/i.test(r.headers.get("content-type")||""))throw new Error(u);return r.json()});
const fetchData=()=>SRC?getJSON(SRC):getJSON("/api/data").then(d=>(SRC="/api/data",d),()=>getJSON("data.json").then(d=>(SRC="data.json",d)));
const live=x=>{const s=String(x&&x.disposition&&x.disposition.status||"").trim().toLowerCase();return !s||s==="proposed"};
const verifying=n=>/^(verifying|waiting|done_pending)$/i.test(String(n.state||n.status||""))||/\b(fleet ops|supervisor) is verifying\b|reported this done/i.test(String(n.detail||""));
function queue(d){ // needs + Nat's live actions, one list, soonest first
  const acts=(d.nat_actions||[]).filter(x=>x&&x.title&&live(x)), gone=new Set((d.nat_actions||[]).filter(x=>x&&x.title&&!live(x)).map(x=>x.title.toLowerCase()));
  const seen=new Set(), out=[];
  for(const n of [...(d.needs||[]),...acts]){if(!n||!n.title||!live(n)||verifying(n)) continue; const k=n.title.toLowerCase(); if(seen.has(k)||gone.has(k)) continue; seen.add(k); out.push(n)}
  const dueKey=n=>isDate(n.due)?ptDay(asDay(n.due)):"9999", tierW=n=>({now:0,week:1,later:2})[String(n.tier||"").toLowerCase()]??1;
  return out.sort((a,b)=>tierW(a)-tierW(b)||dueKey(a).localeCompare(dueKey(b)));
}
const notLater=n=>String(n.tier||"").toLowerCase()!=="later", act=Qn=>Qn.filter(notLater).length;
const dueOf=n=>{if(!isDate(n.due)) return null; const k=ptDay(asDay(n.due)), t=ptDay(NOW()); return {over:k<t,today:k===t,txt:k<t?"overdue":k===t?"today":dayLbl(asDay(n.due))}};

/* ---------- context ---------- */
function moment(d,Qn){
  const now=NOW(), h=ptHour(now), dow=ptDow(now), today=ptDay(now);
  const meets=(d.meetings||[]).filter(m=>m&&isDate(m.when)).sort((a,b)=>new Date(a.when)-new Date(b.when));
  const next=meets.find(m=>{const mu=minsUntil(m.when);return mu>-30&&mu<=45});
  const wk=Qn.find(n=>n.project==="weekly-review");
  if(next) return {kind:"meet",m:next};
  if((dow==="Sun"||dow==="Sat"||dow==="Mon"&&h<12)&&wk) return {kind:"week",n:wk};
  if(h>=18||h<4) return {kind:"eve"};
  if(h>=4&&h<10) return {kind:"morning"};
  return {kind:act(Qn)?"decide":"zero"};
}
function greet(k){const h=ptHour(NOW());
  return k==="meet"?"Heads up":h<4?"Still up?":h<12?"Good morning":h<17?"Good afternoon":h<22?"Good evening":"Winding down"}
function broken(d){ // only real breakage; otherwise invisible
  const out=[], age=(Date.now()-new Date(d.updated))/36e5; // real clock, not the simulated ?at
  if(age>3) out.push(`Data is ${Math.round(age)} h old. The feed normally updates every 15 min.`);
  const W=d.watchdog||{}; if((W.stuck||[]).length) out.push(`${W.stuck.length} agent run${W.stuck.length===1?"":"s"} stuck`); if((W.failed_runs||[]).length) out.push(`${W.failed_runs.length} failed run${W.failed_runs.length===1?"":"s"}`);
  const crit=(d.issues||[]).filter(i=>i.severity==="critical"); if(crit.length) out.push(`${crit.length} critical fleet issue${crit.length===1?"":"s"}: ${crit[0].title}`);
  const FP=d.fleet_pacing&&d.fleet_pacing.agents||{}; const st=Object.keys(FP).filter(k=>FP[k]&&FP[k].stalled===true); if(st.length) out.push(`${st.map(k=>k[0].toUpperCase()+k.slice(1)).join(", ")} stalled with tasks waiting`);
  return out;
}

/* ---------- pieces ---------- */
const G=d=>(d.goals||{}).progress||{};
function capToday(d){const c=G(d).capacity||{}, t=ptDay(NOW()); return (c.days||[]).find(x=>x&&x.date===t)}
function chips(d,Qn){
  const c=G(d).capacity||{}, cap=num(c.booked_pct_next7), r=G(d).relationships||{}, cc=num(r.coffee_chats_calendar);
  const hot=Qn.filter(notLater).filter(n=>{const u=dueOf(n);return u&&(u.over||u.today)}).length;
  return `<div class="strip">
    <a class="chip ${act(Qn)?hot?"warn":"":"good"}" href="#queue"><div class="v mono">${act(Qn)||"0 ✓"}</div><div class="l">${act(Qn)?`need${act(Qn)===1?"s":""} you${hot?` · ${hot} due`:""}`:"nothing waiting"}</div></a>
    <a class="chip ${cap==null?"":cap<=70?"good":cap<=85?"warn":"bad"}" href="#goals"><div class="v mono">${cap==null?"—":cap+"%"}</div><div class="l">booked, next 7 days · cap 70%</div></a>
    <a class="chip ${cc!=null&&cc>=40?"good":""}" href="#goals"><div class="v mono">${cc==null?"—":cc+"<span class=dim style=font-size:13px>/40</span>"}</div><div class="l">coffee chats by Dec 12</div></a></div>`;
}
function answers(n,i){
  const opts=Array.isArray(n.options)&&n.options.length?n.options:["Done","Later"], u=link(n.url);
  const isOpen=o=>/^open\b|^review\b/i.test(o);
  return `<div class="ans">${opts.filter(o=>!(u&&isOpen(o))).map(o=>`<button type="button" data-a="${esc(o)}" data-i="${i}"${o===n.recommend?' class="rec"':""}>${esc(o)}${o===n.recommend?" ★":""}</button>`).join("")}${u?`<a class="open" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>`:""}</div>`;
}
function needCard(n,i){
  const du=dueOf(n), est=num(n.est_min);
  return `<article class="need${du&&du.over?" over":du&&du.today?" hot":""}" data-card="${i}">
    <div class="t">${esc(n.title)}</div>
    <div class="m">${du?`<span class="due">${esc(du.txt)}</span>`:""}${est!=null&&est>0?`<span>${est} min</span>`:""}${n.project?`<span>${esc(n.project)}</span>`:""}</div>
    ${n.detail?`<div class="d">${esc(n.detail)}</div><button type="button" class="more" data-more>More</button>`:""}
    ${answers(n,i)}</article>`;
}
function nowCard(d,M,Qn){
  const today=ptDay(NOW()), meets=(d.meetings||[]).filter(m=>m&&isDate(m.when)&&ptDay(m.when)===today&&new Date(m.when)>NOW()-30*6e4);
  if(M.kind==="meet"){const m=M.m, mu=minsUntil(m.when), ppl=(m.people||[]);
    return `<section class="now meet"><div class="glow"></div><div class="k">${mu>0?`In ${mu} min · ${esc(tm(m.when))}`:"Happening now"}</div><h2>${esc(m.title)}</h2>
      ${m.location?`<p>📍 ${esc(m.location)}</p>`:""}
      ${ppl.slice(0,2).map(p=>`<p><b>${esc(p.name)}</b>${p.who?` · ${esc(p.who)}`:""}${p.last_time?`<br><span style="opacity:.8">Last time: ${esc(p.last_time)}</span>`:""}</p>`).join("")}
      ${(m.questions||[]).length?`<ul>${m.questions.slice(0,3).map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}
      ${m.id?`<a class="cta" href="index.html#m-${esc(encodeURIComponent(m.id))}">Full brief →</a>`:""}</section>`}
  if(M.kind==="week"){const n=M.n, i=Qn.indexOf(n);
    return `<section class="now"><div class="glow"></div><div class="k">Week plan</div><h2>${esc(n.title)}</h2>${n.detail?`<p>${esc(n.detail)}</p>`:""}${answers(n,i)}</section>`}
  if(M.kind==="morning"){const c=capToday(d), first=Qn[0];
    return `<section class="now"><div class="glow"></div><div class="k">Today · ${esc(dayLbl(NOW()))}</div>
      <h2>${first?esc(first.title):"A clear day. Nothing needs you yet."}</h2>${first&&dueOf(first)?`<p>${esc(dueOf(first).txt)}${num(first.est_min)?` · about ${first.est_min} min`:""}</p>`:""}
      <div class="row2"><div><div class="n mono">${meets.length}</div><div class="l">meeting${meets.length===1?"":"s"} today</div></div>
        <div><div class="n mono">${act(Qn)}</div><div class="l">need${act(Qn)===1?"s":""} you</div></div>
        <div><div class="n mono" style="color:${c?c.pct>=85?"var(--bad)":c.pct>70?"var(--warn)":"var(--good)":"inherit"}">${c?c.pct+"%":"—"}</div><div class="l">of today booked</div></div></div>
      ${first?`<a class="cta" href="#queue">Start with this →</a>`:""}</section>`}
  if(M.kind==="decide"){const n=Qn[0];
    return `<section class="now"><div class="glow"></div><div class="k">${act(Qn)===1?"One decision":"Next decision · "+act(Qn)+" waiting"}</div><h2>${esc(n.title)}</h2>
      ${n.detail?`<p>${esc(String(n.detail).slice(0,220))}${String(n.detail).length>220?"…":""}</p>`:""}${answers(n,0)}</section>`}
  if(M.kind==="zero") return zeroCard();
  // evening: what got done, tomorrow's first thing
  const done=(d.agents||[]).reduce((t,a)=>t+(num(a.done_24h)||0),0), decs=(d.decisions||[]).filter(x=>isDate(x.at)&&NOW()-new Date(x.at)<864e5).length;
  const r=G(d).relationships||{}, wk=num(r.coffee_chats_calendar_this_week);
  const tmr=new Date(NOW().getTime()+864e5), tk=ptDay(tmr), tm1=(d.meetings||[]).filter(m=>m&&isDate(m.when)&&ptDay(m.when)===tk).sort((a,b)=>new Date(a.when)-new Date(b.when))[0];
  const tn=Qn.find(n=>{const u=dueOf(n);return u&&(u.over||ptDay(asDay(n.due))<=tk)})||Qn[0];
  return `<section class="now eve"><div class="glow"></div><div class="k">Today, done</div>
    <div class="row2"><div><div class="n mono">${done}</div><div class="l">tasks the fleet finished</div></div><div><div class="n mono">${decs}</div><div class="l">decisions made</div></div>${wk!=null?`<div><div class="n mono">${wk}</div><div class="l">coffee chats this week</div></div>`:""}</div>
    ${(()=>{const WA=(Array.isArray(d.wins)?d.wins:[]).filter(w=>w&&w.text&&(!isDate(w.at)||NOW()-new Date(w.at)<864e5)), W=WA.slice(0,3);
      return W.length?`<div class="k" style="margin-top:16px">Wins</div><ul>${W.map(w=>`<li>${link(w.url)?`<a href="${esc(link(w.url))}" target="_blank" rel="noopener" style="color:#fff">${esc(w.text)}</a>`:esc(w.text)}</li>`).join("")}</ul>${WA.length>3?`<p style="font-size:13px;opacity:.75">+${WA.length-3} more today</p>`:""}`:""})()}
    <h2 style="margin-top:16px;font-size:19px">Tomorrow, first: ${tm1?`${esc(tm1.title)} at ${esc(tm(tm1.when))}`:tn?esc(tn.title):"nothing booked yet"}</h2>
    ${act(Qn)?`<p>${act(Qn)} thing${act(Qn)===1?"":"s"} still need${act(Qn)===1?"s":""} you; ${Qn.filter(n=>{const u=dueOf(n);return u&&u.over}).length} overdue.</p>`:`<p>Inbox zero. Enjoy the evening ✨</p>`}</section>`;
}
function zeroCard(){return `<section class="now zero"><div class="glow"></div><div class="k">All clear</div><h2>Nothing needs you right now ✨</h2><p>The fleet has it. Check back after your next meeting.</p></section>`}
function goals(d){
  const P=G(d), c=P.capacity||{}, cap=num(c.booked_pct_next7), r=P.relationships||{}, cc=num(r.coffee_chats_calendar), k=P.career||{};
  const ring=(v,max,col)=>{const R=26,C=2*Math.PI*R, f=Math.max(0,Math.min(1,(v||0)/max));return `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${R}" fill="none" stroke="#232838" stroke-width="7"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(f*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg>`};
  const days=(c.days||[]).filter(x=>x&&num(x.pct)!=null).slice(0,7);
  const capCol=p=>p>=85?"var(--bad)":p>70?"var(--warn)":"var(--acc)";
  const left=cc==null?null:Math.max(0,40-cc);
  return `<h3 class="sec" id="goals">On track? <span class="c">fall goals</span></h3><div class="goals">
    <div class="goal wide"><div class="gk">Capacity</div><div class="gv mono">${cap==null?"—":cap+"%"} <small>booked · next 7 days · cap 70%</small></div>
      ${cap!=null?`<div class="bar"><i style="width:${Math.min(cap,100)}%;background:${capCol(cap)}"></i><s style="left:70%"></s></div>`:""}
      ${days.length?`<div class="days">${days.map(x=>`<span><i style="height:${Math.max(3,Math.min(x.pct,100))*.34}px;background:${capCol(x.pct)}"></i>${esc(ptDow(asDay(x.date)).slice(0,1))}</span>`).join("")}</div>`:""}
      <div class="gs">${cap==null?"No calendar reading yet":cap<=70?`${70-cap} pts of slack. Room for surprises.`:`${cap-70} pts over. Trim something optional.`}</div></div>
    <div class="goal">${ring(cc,40,"var(--good)")}<div class="gk">Coffee chats</div><div class="gv mono">${cc==null?"—":cc}<small>/40</small></div><div class="gs">${left==null?"":left===0?"Goal hit 🎉":left===1?"1 more to hit 40 🎯":`${left} to go by Dec 12`}</div></div>
    <div class="goal">${ring(num(k.warm_companies),20,"var(--acc2)")}<div class="gk">Warm companies</div><div class="gv mono">${num(k.warm_companies)??"—"}<small>/20</small></div><div class="gs">by Jan 31</div></div>
    <div class="goal wide"><div class="gk">Applications</div><div class="funnel">${[["tracked",k.tracked],["applied",k.applied],["interviewing",k.interviewing],["offers",k.offers]].map(([l,v])=>`<div><b class="mono">${num(v)??"—"}</b><span>${l}</span></div>`).join("")}</div></div>
  </div>`;
}
/* ---------- render ---------- */
function render(){
  const d=D, Qn=queue(d), M=moment(d,Qn), B=broken(d), app=document.getElementById("app");
  const primaryIdx=M.kind==="decide"?0:M.kind==="week"?Qn.indexOf(M.n):-1;
  const rest=Qn.map((n,i)=>[n,i]).filter(([,i])=>i!==primaryIdx);
  const nowT=rest.filter(([n])=>String(n.tier||"now").toLowerCase()!=="later"), later=rest.filter(([n])=>String(n.tier||"").toLowerCase()==="later");
  const sub=[act(Qn)?`${act(Qn)} thing${act(Qn)===1?"":"s"} need${act(Qn)===1?"s":""} you`:"Nothing needs you",(()=>{const c=num((G(d).capacity||{}).booked_pct_next7);return c==null?"":`${c}% booked this week`})()].filter(Boolean).join(" · ");
  app.innerHTML=`<header class="hello"><div><h1>${esc(greet(M.kind))}</h1><div class="sub">${esc(sub)}</div></div><div class="when mono">${esc(dayLbl(NOW()))}<br>${esc(tm(NOW()))}</div></header>
    ${B.length?`<div class="alarm" role="alert"><span class="dot"></span><div><b>Something's broken.</b> ${B.map(esc).join(" · ")}</div></div>`:""}
    ${nowCard(d,M,Qn)}${chips(d,Qn)}
    <h3 class="sec" id="queue">Needs you <span class="c">${act(Qn)?act(Qn)+" · soonest first":""}</span></h3>
    <div class="q">${nowT.length?nowT.map(([n,i])=>needCard(n,i)).join(""):act(Qn)?"":`<div class="zeroq"><div class="e">🎉</div><b>Inbox zero</b>Nothing is waiting on you.</div>`}</div>
    ${later.length?`<details class="later"><summary>${later.length} for later</summary><ul>${later.map(([n])=>`<li><span>${esc(n.title)}</span><span>${dueOf(n)?esc(dueOf(n).txt):""}</span></li>`).join("")}</ul></details>`:""}
    ${goals(d)}
    <a class="fleet" href="index.html#fleet"><div><b>Fleet &amp; machine</b><div class="s">${(d.agents||[]).length} agents · usage, cost, projects, issues</div></div><span aria-hidden="true">→</span></a>
    <div class="foot">Updated ${esc(tm(d.updated))} PT · <a href="index.html">Classic HQ</a> · v2 preview</div>`;
  app.querySelectorAll("[data-more]").forEach(b=>{const el=b.previousElementSibling; if(el.scrollHeight<=el.clientHeight+2){b.remove();return}
    b.addEventListener("click",()=>{el.classList.toggle("open");b.textContent=el.classList.contains("open")?"Less":"More"})});
  app.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>answer(b,Qn[+b.dataset.i],b.dataset.a)));
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}
function celebrate(){const p=document.getElementById("pop");p.classList.add("on");setTimeout(()=>p.classList.remove("on"),900)}
function clearCard(btn){const c=btn.closest(".need")||btn.closest(".now"); if(c&&c.classList.contains("need")){c.classList.add("done");setTimeout(()=>{c.remove();const left=document.querySelectorAll(".q .need").length; if(!left){document.querySelector(".q").innerHTML=`<div class="zeroq"><div class="e">🎉</div><b>Inbox zero</b>Nothing is waiting on you.</div>`}},460)}
  else if(c){c.style.opacity=".6"; c.querySelectorAll(".ans button").forEach(b=>b.disabled=true)}}
async function answer(btn,n,pick){
  if(!n) return; const title="HQ answer: "+n.title+" → "+pick;
  if(ONE){btn.disabled=true;const o=btn.textContent;btn.textContent="Sending…";
    try{const r=await fetch("/api/answer",{method:"POST",headers:{"Content-Type":"application/json","X-HQ":"1"},body:JSON.stringify({title,body:"Answer from HQ v2: "+pick})});
      if(!r.ok) throw r.status; celebrate(); clearCard(btn); toast("Sent ✓");}
    catch(_){btn.disabled=false;btn.textContent=o;ONE=false;toast("One-tap send failed. Tap again to finish on GitHub")} return}
  const u=ISSUE_NEW+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Tap Submit to send this to the autopilot supervisor.");
  let w=null;try{w=window.open(u,"_blank")}catch(_){} if(w){try{w.opener=null}catch(_){}celebrate();clearCard(btn);toast("Opened GitHub: tap Submit")} else toast("Couldn't open GitHub");
}
function probe(){fetch("/api/answer",{method:"POST",headers:{"Content-Type":"application/json","X-HQ":"1"},body:'{"title":""}'}).then(r=>{ONE=r.status===400}).catch(()=>{ONE=false})}
function load(){return fetchData().then(d=>{D=d; if(typeof d.one_click==="boolean") ONE=d.one_click; else if(ONE==null) probe();
  try{render()}catch(e){document.getElementById("app").innerHTML=`<p class="err">HQ v2 hit a display error (${esc(e.message)}). <a href="index.html">Open classic HQ</a></p>`}})
  .catch(()=>{if(!D) document.getElementById("app").innerHTML=`<p class="err">Couldn't load status data. <a href="index.html">Open classic HQ</a></p>`})}
load(); setInterval(()=>{if(document.visibilityState==="visible") load()},5*6e4);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") load()});
</script>
</body>
